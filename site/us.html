<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US midterms 2026</title>
<!-- The US hub is part of the US midterms page now: this address forwards to it, keeping the old
     tab (polls, pollsters, crosstabs, markets, house, track, census) and race. -->
<script>
(() => {
  const q = new URLSearchParams(location.search), to = new URLSearchParams({ id: "us2026" });
  const tab = q.get("tab"), race = q.get("race");
  const TAB = { polls: "polls", crosstabs: "polls", pollsters: "pollsters", markets: "markets", track: "track" };
  if (TAB[tab]) to.set("tab", TAB[tab]);
  if (tab === "house") to.set("office", "house");
  if (tab === "census") to.set("layer", "change_pct");
  if (race && tab !== "house" && tab !== "census") to.set("race", race);
  location.replace(`election.html?${to}`);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=election.html?id=us2026"></noscript>
</head>
<body><p><a href="election.html?id=us2026">US midterms 2026</a></p></body>
</html>
