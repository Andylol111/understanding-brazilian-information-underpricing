<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election night</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dash-page">

<header class="topbar">
  <a class="tb-home" href="./" id="home">All elections</a>
  <h1 class="tb-name" id="title">Loading…</h1>
  <span class="tb-date" id="date"></span>
  <span class="tb-evidence" id="evidence"></span>
  <label class="tb-switch"><span class="visually-hidden">Election</span><select id="switcher" aria-label="Choose an election"></select></label>
  <span class="tb-live" id="live" hidden></span>
</header>

<main class="dash" id="dash">
  <p class="dash-note" id="dash-note" hidden></p>

  <section class="panel p-map" id="map-panel" aria-label="Map">
    <div class="map-head">
      <nav class="crumbs" id="crumbs" aria-label="Map level"></nav>
      <span class="engine-note note" id="engine-note" hidden></span>
    </div>
    <div class="map-body">
      <div class="map-box" id="map">
        <div class="map-ui map-modes toggle" id="map-mode" role="group" aria-label="Map colour"></div>
        <div class="map-ui map-layers toggle" id="map-layer" role="group" aria-label="Units shown" hidden></div>
        <button type="button" class="map-ui map-national" id="extent" hidden>Whole map</button>
        <div class="map-ui map-legend" id="legend"></div>
        <div class="map-ui map-frame" id="frame-label"></div>
        <div class="place-card" id="place" hidden></div>
        <p class="map-empty note" id="map-empty">Loading the map…</p>
        <div class="national off" id="national"></div>
      </div>
      <aside class="region-picker" id="regions" aria-label="Regions" hidden></aside>
    </div>
  </section>

  <section class="panel p-scrub" id="scrub-panel" aria-label="Time">
    <div class="scrub-controls">
      <button type="button" id="play" class="btn">Play</button>
      <div class="toggle speed" id="speed" role="group" aria-label="Playback speed">
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="4" aria-pressed="false">4×</button>
        <button type="button" data-speed="16" aria-pressed="false">16×</button>
      </div>
      <p class="scrub-time" id="scrub-time" aria-live="off"></p>
    </div>
    <div id="scrubber"></div>
  </section>

  <section class="panel p-readout" id="readout" aria-label="Selected race at the chosen time" aria-live="polite"></section>
  <section class="panel p-summary" id="nat-summary" aria-label="All races of the office"></section>

  <section class="panel p-timeline" aria-label="Race timeline">
    <div class="tl-head">
      <label class="select"><span>Race</span> <select id="race"></select></label>
    </div>
    <div id="timeline" class="timeline"></div>
    <p class="note" id="tl-note"></p>
  </section>

  <section class="panel p-tabs">
    <div class="tabs" role="tablist" aria-label="Details">
      <button type="button" role="tab" id="tab-races" aria-controls="pane-races" aria-selected="true">Races</button>
      <button type="button" role="tab" id="tab-stats" aria-controls="pane-stats" aria-selected="false">Statistics</button>
      <button type="button" role="tab" id="tab-method" aria-controls="pane-method" aria-selected="false">Method &amp; sources</button>
    </div>
    <div class="tab-panes">
      <div role="tabpanel" id="pane-races" aria-labelledby="tab-races"></div>
      <div role="tabpanel" id="pane-stats" aria-labelledby="tab-stats" hidden></div>
      <div role="tabpanel" id="pane-method" aria-labelledby="tab-method" hidden></div>
    </div>
  </section>
</main>

<script src="load-error.js"></script>
<script type="module">import("./election.js").catch(window.__showLoadError);</script>
</body>
</html>
