[project]
name = "brunder"
version = "0.1.0"
description = "Underpricing of public election information in prediction markets: Brazil 2026 on Polymarket"
readme = "README.md"
authors = [
    { name = "Andylol111", email = "[email removed]" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "httpx[http2]>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
brunder = "brunder.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]
