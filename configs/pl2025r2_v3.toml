# pl2025r2 v3 SENSITIVITY: POLL START (RETROSPECTIVE, NOT PRE-REGISTERED: designed after the result was known, chosen after the
# result was known). v1 stays the headline. Everything is v1's (prior, tau, rho, kappa, count states) except a starting
# estimate of the national swing from the final polls (analysis/poll_priors.py; rule written before this night was replayed with it):
#   swing_prior_mean = poll two-way share of Trzaskowski / (Trzaskowski + Nawrocki) 0.5037 (plain mean of 21 polls whose fieldwork ended
#       2025-05-18 .. 2025-05-30, the 14 days before the vote; Wikipedia poll tables, CC BY-SA, data_public/)
#       minus the prior's vote-weighted two-way share 0.4866 (2020 runoff by cell);
#   swing_prior_sd = root-mean-square error of the same kind of poll average over 7 earlier elections = 0.0350;
#   count_scaled_terms: tau enters in proportion to the weight the counted votes have in the swing, so before any count the
#       uncertainty is the poll error alone; no count, price or exit poll of this night is an input.
id = "pl2025r2_v3"
election = "Poland, presidential runoff, 2025-06-01; polls closed 19:00 UTC (21:00 CEST)"
round = 2
poll_close_utc = "2025-06-01T19:00:00Z"

[model]                      # brunder.nowcast.Params over 128 cells (16 voivodeships x 8 gmina-size classes) + abroad
tau = 0.005                  # smallest tau with 90% coverage >= 0.90 over the 14 round-1 night frames at 1-95% counted
sigma_mun0 = 0.06            # nowcast default, held fixed (see analysis/pl_calibrate.py)
kappa = 100000.0             # lowest MAE at that tau (round-1 night)
rho = 0.8                    # same
nu_mun = 20.0                # nowcast default
sigma_uf0 = 0.03             # nowcast default
nu_uf = 5.0                  # nowcast default
swing_prior_mean = 0.01713    # poll 0.50368 - prior base 0.48655
swing_prior_sd = 0.03495      # RMS poll error, 7 earlier elections
count_scaled_terms = true

[poll]
file = "pl_polls_2025r2.csv"
election_date = "2025-06-01"
n_polls = 21
two_way = 0.50368
prior_base = 0.48655
sd = 0.03495
n_errors = 7
pollsters = ["AtlasIntel", "CBOS", "IBRiS / Onet", "IBRiS / Polsat News", "IBRiS / Polskie Radio 24", "IPSOS / \"19:30\" TVP Info", "IPSOS / “OKO.press”", "OGB", "OGB / “WP.pl”", "Opinia24", "Opinia24 / \"Fakty\" TVN, TVN24", "Opinia24 / RMF FM", "Opinia24 / Radio ZET", "Pollster / “SE.pl”", "Research Partner / ARIADNA", "Social Changes / wnet.fm (71% turnout scenario)", "United Surveys / WP.pl", "United Surveys / “WP.pl”"]

[prior]                      # 2020 runoff, Trzaskowski vs Duda, by cell (brunder.poland.prior)
source = "https://prezydent20200628.pkw.gov.pl/prezydent20200628/data/2/csv/wyniki_gl_na_kand_po_gminach_csv.zip"

[prices]
start_utc = "2025-05-31T04:00:00Z"
end_utc = "2025-06-02T08:00:00Z"   # before the markets resolved (Polymarket 08:55 UTC)

