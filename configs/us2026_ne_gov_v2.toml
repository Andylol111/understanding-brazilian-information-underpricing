# US midterms 2026-11-03, Nebraska governor: model v2. Identical to us2026_ne_gov_v1.toml (sha256 ba7272adf0a5a56f6200d0c8e568c7dd960dc8a98d728abaa6418446116fcbfa)
# except a prior on the statewide swing from the polls ([model] swing_prior_*; brunder.nowcast): the
# swing is the precision-weighted mix of the poll prior and the swing in counted votes, so the polls
# lead early and the count takes over. Poll average frozen here (rule docs/us_midterms.md#polls;
# VoteHub polls, CC BY 4.0, data built 2026-10-29T18:33:58Z); nothing is fetched on the night. v1 and v2 are both
# registered and scored.
id = "us2026_ne_gov_v2"

[election]
eid = "us2026"
race_id = "ne-gov"
name = "Nebraska governor"
state = "ne"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "ne"                    # brunder.us.FEEDS (NE SoS results web service GetMapData, race 13508; plain --url)
poll_close_utc = "2026-11-04T02:00:00Z"
a = { party = "DEM", name = "Lynne Walz", color = "#1f5fbf" }
b = { party = "REP", name = "Jim Pillen", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "ne_gov_2022"        # 2022 governor (Blood v Pillen): same office, last midterm (MEDSL precinct returns of the certified results, CC0)
votes = "ne_gov_2022"        # 2022 governor two-party votes
poll_avg = 0.4648           # two-party Dem share, weighted average of 3 polls
poll_sd = 0.0419            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 3
poll_last = "2026-10-23"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.2003        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 replays without a vote-type split (this feed has none), as SC/FL
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.0869   # poll_avg - prior statewide share 0.3779 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0419      # = poll_sd

[count]                    # brunder.us.CountRules
# NE counties count early ballots on election night; the service gives precincts reporting per county and no
# vote-type split: f = counted / expected votes, capped at 0.95 until every precinct reported, then 98% counted;
# complete counties re-scale the rest (learned turnout).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = false

[markets.polymarket]
event = "nebraska-governor-winner-2026"
market = "will-the-democrats-win-the-nebraska-governor-race-in-2026"
question = "Will the Democrats win the Nebraska governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
