# US midterms 2026-11-03, South Carolina governor: model v2. Identical to us2026_sc_gov_v1.toml (sha256 9387f6d9dd3f816bd4b179ddf5f43e8131e2c0163be03683f8c1fa5faef78ccd)
# except a prior on the statewide swing from the polls ([model] swing_prior_*; brunder.nowcast): the
# swing is the precision-weighted mix of the poll prior and the swing in counted votes, so the polls
# lead early and the count takes over. Poll average frozen here (rule docs/us_midterms.md#polls;
# VoteHub polls, CC BY 4.0, data built 2026-10-29T00:09:07Z); nothing is fetched on the night. v1 and v2 are both
# registered and scored.
id = "us2026_sc_gov_v2"

[election]
eid = "us2026"
race_id = "sc-gov"
name = "South Carolina governor"
state = "sc"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "sc"                    # brunder.us.FEEDS (Clarity ENR, eid resolved on the day)
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Jermaine Johnson", color = "#1f5fbf" }
b = { party = "REP", name = "Alan Wilson", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "sc_gov_2022"        # 2022 governor (Cunningham v McMaster): same office, last midterm (SC Election Commission)
votes = "sc_gov_2022"        # 2022 governor two-party votes
poll_avg = 0.4279           # two-party Dem share, weighted average of 2 polls
poll_sd = 0.0407            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 2
poll_last = "2026-10-25"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.0383        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays without a vote-type split (the SC feed has none)
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.0159   # poll_avg - prior statewide share 0.4120 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0407      # = poll_sd

[count]                    # brunder.us.CountRules
# As sc-sen.
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true

[markets.polymarket]
event = "south-carolina-governor-winner-2026"
market = "will-the-democrats-win-the-south-carolina-governor-race-in-2026"
question = "Will the Democrats win the South Carolina governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
