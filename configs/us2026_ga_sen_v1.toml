# US midterms 2026-11-03, Georgia Senate. Frozen before polls close (first close 2026-11-03 23:00 UTC); the integrator
# registers it (prereg/registry.jsonl). Nothing here was chosen on 2026 count data. Settings and evidence:
# docs/us_midterms.md. Live/replay: uv run brunder us live|export configs/us2026_*_v1.toml
id = "us2026_ga_sen_v1"

[election]
eid = "us2026"
race_id = "ga-sen"
name = "Georgia Senate"
state = "ga"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "ga"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Jon Ossoff", color = "#1f5fbf" }
b = { party = "REP", name = "Mike Collins", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "ga_sen_2022"        # 2022 Senate general (Warnock v Walker): same office, last midterm
votes = "ga_sen_2022"        # 2022 Senate two-party votes

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py)
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08

[count]                    # brunder.us.CountRules
# GA posts advance + mail votes first and finishes Election Day precincts on the night: a county with
# every precinct reported is taken as 98% counted; those counties re-scale the rest (learned turnout).
# Settings checked on GA 2022/2024 certified vote-type results (analysis/us_calibrate.py).
# vote_type: counties split into early+mail and Election Day units (the feed reports early votes);
# early_share = 0.64 = GA 2022 governor/Senate advance+mail share (SoS certified).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.64

[markets.polymarket]
event = "georgia-senate-election-winner"
market = "will-the-democrats-win-the-georgia-senate-race-in-2026"
question = "Will the Democrats win the Georgia Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
