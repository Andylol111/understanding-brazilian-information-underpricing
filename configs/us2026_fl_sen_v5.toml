# US midterms 2026-11-03, Florida Senate: model v5 (SECONDARY; the primary stays us2026_fl_sen_v3).
# Identical to us2026_fl_sen_v3.toml (sha256 036be93af518e92a9d54e3d651c02ad2a593230eaec9a2bc769e6d6422792b52) except the night Hispanic slope: a county's expected swing is
# the state swing + beta*(its Hispanic share - the state's expected-vote mean), with beta estimated from the
# night's own counted counties (vote-weighted least squares, Normal(0, hisp_slope_tau^2) prior shrinking it
# to 0 when few counties have reported) and its uncertainty added to the margin variance. The slope is never
# carried over from earlier cycles (it changes sign). Hispanic share: Census ACS 2020-24 B03003.
# Backtest and choice of hisp_slope_tau: docs/us_hisp_slope.md.
id = "us2026_fl_sen_v5"
role = "secondary"

[election]
eid = "us2026"
race_id = "fl-sen"
name = "Florida Senate"
state = "fl"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "fl"                    # brunder.us.FEEDS (Division of Elections election-night results file)
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Angie Nixon", color = "#1f5fbf" }
b = { party = "REP", name = "Ashley Moody", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "fl_sen_2022"        # 2022 Senate (Demings v Rubio): same office, last midterm (Division of Elections official results)
votes = "fl_sen_2022"        # 2022 Senate two-party votes
poll_avg = 0.4669           # two-party Dem share, weighted average of 10 polls
poll_sd = 0.0396            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 10
poll_last = "2026-10-27"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.2012        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 replays without a vote-type split (the FL file has none), as SC
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.0498   # poll_avg - prior statewide share 0.4171 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0334      # historical RMSE of a poll average with 10 polls (brunder.us.POLL_SD_BINS)
count_scaled_terms = true   # tau / between-region terms scale in with the counted votes
hisp_slope = true               # night Hispanic slope (brunder.nowcast): swing = state swing + beta*(h - state h)
hisp_slope_tau = 0.2           # prior sd of beta, chosen on backtests before 2026 (docs/us_hisp_slope.md)

[count]                    # brunder.us.CountRules
# Florida counties post early and mail votes at poll close (0 precincts reported), then Election Day precincts. The
# results file has no vote-type split, so one unit per county (vote_type off): f = counted / expected votes, capped
# at 0.95 until every precinct reported, then 98% counted; complete counties re-scale the rest (learned turnout).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = false
hisp_share = "data_public/us2026_hispanic_share.csv"   # county Hispanic share, ACS 2020-24 B03003

[markets.polymarket]
event = "florida-senate-election-winner"
market = "will-the-democrats-win-the-florida-senate-race-in-2026"
question = "Will the Democrats win the Florida Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
