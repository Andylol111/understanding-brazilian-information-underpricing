# US midterms 2026-11-03, Ohio Senate (special): model v2. Identical to us2026_oh_sen_v1.toml (sha256 d9681b40a6f088df5c9859ab3beea917114d2ec8ce986791c8011e54cad182e9)
# except a prior on the statewide swing from the polls ([model] swing_prior_*; brunder.nowcast): the
# swing is the precision-weighted mix of the poll prior and the swing in counted votes, so the polls
# lead early and the count takes over. Poll average frozen here (rule docs/us_midterms.md#polls;
# VoteHub polls, CC BY 4.0, data built 2026-10-29T00:09:07Z); nothing is fetched on the night. v1 and v2 are both
# registered and scored.
# No county prior for this race yet: the swing prior needs its baseline (v2 = v1).
id = "us2026_oh_sen_v2"

[election]
eid = "us2026"
race_id = "oh-sen"
name = "Ohio Senate (special)"
state = "oh"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "oh"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T00:30:00Z"
a = { party = "DEM", name = "Sherrod Brown", color = "#1f5fbf" }
b = { party = "REP", name = "Jon Husted", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "oh_pres_2024"        # 2024 president (MEDSL county returns, CC0); Ohio SoS files are not reachable by script (403)
votes = "oh_pres_2024"        # 2024 president two-party votes × 0.72 (mean 2022/2024 two-party ratio in CA, TX, GA official data)
poll_avg = 0.5196           # two-party Dem share, weighted average of 13 polls
poll_sd = 0.0393            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 13
poll_last = "2026-10-23"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.6908        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, no vote-type split (OH feed has none)
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08

[count]                    # brunder.us.CountRules
# OH reports, per county, ballots counted and ballots still outstanding (UOCAVA absentee +
# provisional): once Election Day precincts are all in, remaining = outstanding ballots.
turnout_ratio = 0.72
f_max = 0.95
f_complete = 0.0
use_outstanding = true
learn_turnout = true

[markets.polymarket]
event = "ohio-senate-election-winner"
market = "will-the-democrats-win-the-ohio-senate-race-in-2026"
question = "Will the Democrats win the Ohio Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
