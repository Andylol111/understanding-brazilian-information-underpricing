# US midterms 2026-11-03, Georgia Senate: model v3. Identical to us2026_ga_sen_v2.toml (sha256 3f685635963a6094f3db925e37924db8f10d392a52e5b165770efbb9e701accf)
# except the pre-count uncertainty: swing_prior_sd = the historical error of a poll average with this
# many polls (538 raw_polls 2016-2022, CC BY 4.0; analysis/us_polls.py errorbins), and
# count_scaled_terms = true, so before any vote the statewide uncertainty is that poll error alone and
# the reporting-order / between-region terms grow with the counted votes (brunder.nowcast). Earlier
# versions stay registered and scored.
id = "us2026_ga_sen_v3"

[election]
eid = "us2026"
race_id = "ga-sen"
name = "Georgia Senate"
state = "ga"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "ga"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Jon Ossoff", color = "#1f5fbf" }
b = { party = "REP", name = "Mike Collins", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "ga_sen_2022"        # 2022 Senate general (Warnock v Walker): same office, last midterm
votes = "ga_sen_2022"        # 2022 Senate two-party votes
poll_avg = 0.5506           # two-party Dem share, weighted average of 7 polls
poll_sd = 0.0399            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 7
poll_last = "2026-10-23"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.8977        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py)
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0457   # poll_avg - prior statewide share 0.5049 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0334      # historical RMSE of a poll average with 7 polls (brunder.us.POLL_SD_BINS)
count_scaled_terms = true   # tau / between-region terms scale in with the counted votes

[count]                    # brunder.us.CountRules
# GA posts advance + mail votes first and finishes Election Day precincts on the night: a county with
# every precinct reported is taken as 98% counted; those counties re-scale the rest (learned turnout).
# Settings checked on GA 2022/2024 certified vote-type results (analysis/us_calibrate.py).
# vote_type: counties split into early+mail and Election Day units (the feed reports early votes);
# early_share = 0.64 = GA 2022 governor/Senate advance+mail share (SoS certified).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.64

[markets.polymarket]
event = "georgia-senate-election-winner"
market = "will-the-democrats-win-the-georgia-senate-race-in-2026"
question = "Will the Democrats win the Georgia Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
