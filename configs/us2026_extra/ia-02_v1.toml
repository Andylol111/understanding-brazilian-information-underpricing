# SECONDARY SOURCE, ADDED 2026-11-02, UNREGISTERED. IA-02 U.S. House from Iowa Secretary of State, Election Night Reporting (Clarity) (ia_house feed,
# brunder.extra_clarity; analysis/us_extra_mw.py configs). Kept out of registered scoring.
# US midterms 2026-11-03, IA-02 U.S. House: model v1. No swing: the count alone moves the 2024 president baseline.
# Counted units = the district's counties (a split county: only its part in the district, as the feed reports it).
# Prior = 2024 president in each county's part of the 2026 district (data_public/us2026_extra_priors_clarity_mw.csv,
# analysis/us_extra_mw.py priors; same allocation as site/data/us2026/house/districts.json). Settings from the
# 2024 replay of the same feed's House contests (analysis/us_house_night.py replay; data_public/us2026_house_calibration.json):
# Iowa's feed is not in the replay (added 2026-11-02); settings of the replayed group of feeds without a vote-type split (FL, SC, OH), 34 replayed districts; 90 % coverage 0.98/0.95/0.87 at 5/25/50 % counted, mean |error| 0.016/0.015/0.013.
# Frozen before polls close; NOT registered (secondary source). Nothing here was chosen on 2026 count
# data. Market selection: P(D) Polymarket 0.705, Kalshi 0.715 in markets.json built 2026-10-29 (rule: Polymarket or Kalshi in [0.05, 0.95]).
id = "us2026_extra_ia-02_v1"

[election]
eid = "us2026"
race_id = "house:IA-02"
name = "IA-02 U.S. House"
state = "ia"
source = "Iowa Secretary of State, Election Night Reporting (Clarity)"
source_url = "https://electionresults.iowa.gov/IA/"
race = "house-02"             # race key in the parsed feed (brunder.us_house_night)
feed = "ia_house"             # brunder.us.FEEDS: the state's recorded feed, House contests
poll_close_utc = "2026-11-04T03:00:00Z"
a = { party = "DEM", name = "Lindsay James", color = "#1f5fbf" }
b = { party = "REP", name = "Joe Mitchell", color = "#c8102e" }

[prior]
share = "ia-02_pres_2024"     # 2024 president (Harris v Trump), county parts of the 2026 district
votes = "ia-02_pres_2024"     # its two-party votes × turnout_ratio = expected 2026 two-party votes

[model]                    # brunder.nowcast.Params
tau = 0.01
rho = 0.3
sigma_mun0 = 0.08
sigma_uf0 = 0.03                # prior sd of a region's swing (one district = one region; early/late with vote_type)

[count]                    # brunder.us.CountRules
turnout_ratio = 0.72         # 2026 midterm / 2024 president two-party votes (brunder.us.EST_TURNOUT)
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = false

[markets.polymarket]
event = "ia-02-house-election-winner"
market = "will-the-democratic-party-win-the-ia-02-house-seat"
question = "Will the Democratic Party win the IA-02 House seat?"
yes_is = "a"

[markets.kalshi]           # timeline line needs a pair in configs/pairs/us2026.toml (race_id "house:IA-02")
ticker = ""                # Kalshi event KXHOUSERACE-IA02-26, YES = KXHOUSERACE-IA02-26-D
