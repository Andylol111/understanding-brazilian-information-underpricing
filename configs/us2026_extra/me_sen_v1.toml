# SECONDARY SOURCE, ADDED 2026-11-02, UNREGISTERED. Maine U.S. Senate from already-recorded civicAPI snapshots.
# County totals are an aggregator fallback because maine.gov returned a CloudFront 403 to the honest Mac probe.
# Live behaviour is unrehearsed; Maine ranked-choice transfers can make the initial-round two-candidate projection diverge.
id = "us2026_extra_me_sen_v1"
role = "secondary"

[election]
eid = "us2026"
race_id = "me-sen"
name = "Maine Senate"
state = "me"
race = "sen"
feed = "civic_me"
source = "civicAPI (civicapi.org), already-recorded snapshots"
source_url = "https://civicapi.org"
poll_close_utc = "2026-11-04T01:00:00Z"
a = { party = "DEM", name = "Troy Jackson", color = "#1f5fbf" }
b = { party = "REP", name = "Susan Collins", color = "#c8102e" }

[prior]
share = "me_pres_2024"
votes = "me_pres_2024"

[model]
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08
# Poll swing prior (analysis/us_extra_swing.py): polls frozen from site/data/us2026/overview.json, asof 2026-11-01 (VoteHub, CC BY 4.0); registered civic v3 settings.
poll_avg = 0.5135          # two-party Dem share, 12 polls, last 2026-10-26
poll_sd = 0.0394
swing_prior_mean = -0.0195   # poll avg - prior statewide share 0.5330 (V-weighted)
swing_prior_sd = 0.0228   # historical RMSE of a poll average with 12 polls (brunder.us.POLL_SD_BINS)
count_scaled_terms = true   # tau / between-region terms scale in with the counted votes

[count]
turnout_ratio = 0.72
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true

[markets.polymarket]
event = "maine-senate-election-winner"
