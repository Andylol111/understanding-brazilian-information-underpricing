# SECONDARY SOURCE, ADDED 2026-11-02, UNREGISTERED. WI-01 U.S. House from Kenosha County and Rock County clerks (wi_house feed,
# brunder.extra_wi; analysis/us_extra_mw.py configs). Kept out of registered scoring.
# PARTIAL COVERAGE: Kenosha and Rock (WI-01 part) counties = 38 % of the district's 2024 presidential vote;
# Racine (27 %, site 403), Milwaukee (21 %, Cloudflare challenge) and Walworth (14 %, no fixed URL) are
# projected from the prior and the swing of the covered counties.
# US midterms 2026-11-03, WI-01 U.S. House: model v1. No swing: the count alone moves the 2024 president baseline.
# Counted units = the district's counties (a split county: only its part in the district, as the feed reports it).
# Prior = 2024 president in each county's part of the 2026 district (data_public/us2026_extra_priors_wi.csv,
# analysis/us_extra_mw.py priors; same allocation as site/data/us2026/house/districts.json). Settings from the
# 2024 replay of the same feed's House contests (analysis/us_house_night.py replay; data_public/us2026_house_calibration.json):
# Wisconsin's feed is not in the replay (added 2026-11-02); settings of the replayed group of feeds without a vote-type split (FL, SC, OH), 34 replayed districts; 90 % coverage 0.98/0.95/0.87 at 5/25/50 % counted, mean |error| 0.016/0.015/0.013.
# Frozen before polls close; NOT registered (secondary source). Nothing here was chosen on 2026 count
# data. Market selection: P(D) Polymarket 0.460, Kalshi 0.475 in markets.json built 2026-10-29 (rule: Polymarket or Kalshi in [0.05, 0.95]).
id = "us2026_extra_wi-01_v1"

[election]
eid = "us2026"
race_id = "house:WI-01"
name = "WI-01 U.S. House"
state = "wi"
source = "Kenosha County and Rock County clerks"
source_url = "https://apps.kenoshacounty.org/ElectionResults_v2/ ; http://elections.co.rock.wi.us/"
race = "house-01"             # race key in the parsed feed (brunder.us_house_night)
feed = "wi_house"             # brunder.us.FEEDS: the state's recorded feed, House contests
poll_close_utc = "2026-11-04T02:00:00Z"
a = { party = "DEM", name = "Mitchell Berman", color = "#1f5fbf" }
b = { party = "REP", name = "Bryan Steil", color = "#c8102e" }

[prior]
share = "wi-01_pres_2024"     # 2024 president (Harris v Trump), county parts of the 2026 district
votes = "wi-01_pres_2024"     # its two-party votes × turnout_ratio = expected 2026 two-party votes

[model]                    # brunder.nowcast.Params
tau = 0.01
rho = 0.3
sigma_mun0 = 0.08
sigma_uf0 = 0.03                # prior sd of a region's swing (one district = one region; early/late with vote_type)

[count]                    # brunder.us.CountRules
turnout_ratio = 0.72         # 2026 midterm / 2024 president two-party votes (brunder.us.EST_TURNOUT)
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = false

[markets.polymarket]
event = "wi-01-house-election-winner"
market = "will-the-democratic-party-win-the-wi-01-house-seat"
question = "Will the Democratic Party win the WI-01 House seat?"
yes_is = "a"

[markets.kalshi]           # timeline line needs a pair in configs/pairs/us2026.toml (race_id "house:WI-01")
ticker = ""                # Kalshi event HOUSEWI1-26, YES = HOUSEWI1-26-D
