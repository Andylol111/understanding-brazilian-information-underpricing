# SECONDARY SOURCE, ADDED 2026-11-02, UNREGISTERED. US midterms 2026-11-03, MD-01 U.S. House: model v1 on Maryland State Board of Elections, unofficial 2026 general election results.
# No swing: the count alone moves the 2024 president baseline. Counted units = the district's counties (a split
# county: only its part in the district, as the feed reports it).
# Prior = 2024 president in each county's part of the district (data_public/us2026_extra_priors_md.csv,
# analysis/us_extra_ne.py priors; same allocation as site/data/us2026/house/districts.json). Settings (tau, rho, sigma_uf0)
# are the group "nosplit" settings of data_public/us2026_house_calibration.json: 90 % coverage 0.98/0.95/0.87 at 5/25/50 % counted, mean |error| 0.016/0.015/0.013.
# The Maryland feed is not in that replay; its parser is checked on the 2024 general District 1 county table (official totals matched exactly).
# Nothing here was chosen on 2026 count data. Market selection: P(D) Polymarket 0.155, Kalshi 0.145 in markets.json built 2026-10-29.
id = "us2026_extra_md-01_v1"

[election]
eid = "us2026"
race_id = "house:MD-01"
name = "MD-01 U.S. House"
state = "md"
race = "house-01"
feed = "md_house"
source = "Maryland State Board of Elections, unofficial 2026 general election results"
source_url = "https://elections.maryland.gov/elections/2026/general_results/gen_results_2026_4_1.html"
poll_close_utc = "2026-11-04T01:00:00Z"
a = { party = "DEM", name = "Dan Schwartz", color = "#1f5fbf" }
b = { party = "REP", name = "Andy Harris", color = "#c8102e" }

[prior]
share = "md-01_pres_2024"
votes = "md-01_pres_2024"

[model]
tau = 0.01
rho = 0.3
sigma_mun0 = 0.08
sigma_uf0 = 0.03

[count]
turnout_ratio = 0.72
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = false

[markets.polymarket]
event = "md-01-house-election-winner"
market = "will-the-democratic-party-win-the-md-01-house-seat"
question = "Will the Democratic Party win the MD-01 House seat?"
yes_is = "a"

[markets.kalshi]
ticker = ""                # Kalshi event KXHOUSERACE-MD01-26, YES = KXHOUSERACE-MD01-26-D
