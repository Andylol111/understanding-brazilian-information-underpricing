# SECONDARY SOURCE, ADDED 2026-11-02, UNREGISTERED. IA-01 U.S. House from Iowa Secretary of State, Election Night Reporting (Clarity) (ia_house feed,
# brunder.extra_clarity; analysis/us_extra_mw.py configs). Kept out of registered scoring.
# US midterms 2026-11-03, IA-01 U.S. House: model v2. Identical to v1 except a prior on the district swing = the generic-ballot shift (markets.json generic_ballot) with its error and the spread of House vs president.
# Counted units = the district's counties (a split county: only its part in the district, as the feed reports it).
# Prior = 2024 president in each county's part of the 2026 district (data_public/us2026_extra_priors_clarity_mw.csv,
# analysis/us_extra_mw.py priors; same allocation as site/data/us2026/house/districts.json). Settings from the
# 2024 replay of the same feed's House contests (analysis/us_house_night.py replay; data_public/us2026_house_calibration.json):
# Iowa's feed is not in the replay (added 2026-11-02); settings of the replayed group of feeds without a vote-type split (FL, SC, OH), 34 replayed districts; 90 % coverage 0.98/0.96/0.90 at 5/25/50 % counted, mean |error| 0.024/0.018/0.014.
# Frozen before polls close; NOT registered (secondary source). Nothing here was chosen on 2026 count
# data. Market selection: P(D) Polymarket 0.935, Kalshi 0.922 in markets.json built 2026-10-29 (rule: Polymarket or Kalshi in [0.05, 0.95]).
id = "us2026_extra_ia-01_v2"

[election]
eid = "us2026"
race_id = "house:IA-01"
name = "IA-01 U.S. House"
state = "ia"
source = "Iowa Secretary of State, Election Night Reporting (Clarity)"
source_url = "https://electionresults.iowa.gov/IA/"
race = "house-01"             # race key in the parsed feed (brunder.us_house_night)
feed = "ia_house"             # brunder.us.FEEDS: the state's recorded feed, House contests
poll_close_utc = "2026-11-04T03:00:00Z"
a = { party = "DEM", name = "Christina Bohannan", color = "#1f5fbf" }
b = { party = "REP", name = "Mariannette Miller-Meeks", color = "#c8102e" }

[prior]
share = "ia-01_pres_2024"     # 2024 president (Harris v Trump), county parts of the 2026 district
votes = "ia-01_pres_2024"     # its two-party votes × turnout_ratio = expected 2026 two-party votes
generic_ballot_shift = 0.0552   # VoteHub generic-ballot average 0.5477 − 0.4925

[model]                    # brunder.nowcast.Params
tau = 0.01
rho = 0.6
sigma_mun0 = 0.08
sigma_uf0 = 0.03                # prior sd of a region's swing (one district = one region; early/late with vote_type)
swing_prior_mean = 0.0552   # = generic_ballot_shift
swing_prior_sd = 0.052     # sqrt(0.0429^2 generic-ballot error + 0.0294^2 House vs president, 2024)

[count]                    # brunder.us.CountRules
turnout_ratio = 0.72         # 2026 midterm / 2024 president two-party votes (brunder.us.EST_TURNOUT)
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = false

[markets.polymarket]
event = "ia-01-house-election-winner"
market = "will-the-democratic-party-win-the-ia-01-house-seat"
question = "Will the Democratic Party win the IA-01 House seat?"
yes_is = "a"

[markets.kalshi]           # timeline line needs a pair in configs/pairs/us2026.toml (race_id "house:IA-01")
ticker = ""                # Kalshi event HOUSEIA1-26, YES = HOUSEIA1-26-D
