# FROZEN 2026-10-28, before the 2026 count. Evidence label: FORWARD.
# Integrator: commit and register this file before 2026-11-07T06:00:00Z. Never edit after registration.
# The model settings use only official 2017, 2020 and 2023 results. analysis/nz_calibrate.py computes
# centred party log-share swing RMS = 1.056 (2017→2020) and 0.468 (2020→2023); 0.817 is their pooled RMS.
# No 2026 count data, polling or market prices were used to choose any setting.
id = "nz2026_v1"
election = "New Zealand general election, 2026-11-07; polls close 19:00 NZDT"
poll_close_utc = "2026-11-07T06:00:00Z"
seed = 20261107

[model]
prior_votes = 50000.0       # national party-ratio shrinkage, roughly one electorate
own_votes = 2000.0          # votes for a partly counted electorate to outweigh its 2023 composition
growth_votes = 100000.0     # turnout growth shrinkage toward 1
party_log_sd = 0.817        # pooled RMS log-share transition, official 2017→20 and 2020→23 results
floor_log_sd = 0.015        # nonzero uncertainty before final/special votes; fixed, not tuned
candidate_log_sd = 0.25     # candidate-score uncertainty; conservative fixed design choice
incumbent_bonus = 1.20      # prior electorate winner score before returns; fixed design choice
lock_fraction = 0.85        # raw candidate shares fully replace the prior at this voting-place fraction
draws = 4000

[prior]
party_votes = "https://electionresults.govt.nz/electionresults_2023/statistics/csv/votes-for-registered-parties-by-electorate.csv"
winners = "https://electionresults.govt.nz/electionresults_2023/statistics/csv/winning-electorate-candidates.csv"
public_file = "data_public/nz2023_electorates.csv"

[feed]
base = "https://media.election.net.nz/xml/"
interval_seconds = 120

