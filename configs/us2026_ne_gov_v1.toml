# US midterms 2026-11-03, Nebraska governor. Frozen before polls close (2026-11-04 02:00 UTC; western counties 03:00); the integrator registers it
# (prereg/registry.jsonl). Nothing here was chosen on 2026 count data. Settings and evidence: docs/us_midterms.md
# ("More states", added 2026-10-30). Live/replay: uv run brunder us live|export configs/us2026_*_v1.toml
id = "us2026_ne_gov_v1"

[election]
eid = "us2026"
race_id = "ne-gov"
name = "Nebraska governor"
state = "ne"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "ne"                    # brunder.us.FEEDS (NE SoS results web service GetMapData, race 13508; plain --url)
poll_close_utc = "2026-11-04T02:00:00Z"
a = { party = "DEM", name = "Lynne Walz", color = "#1f5fbf" }
b = { party = "REP", name = "Jim Pillen", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "ne_gov_2022"        # 2022 governor (Blood v Pillen): same office, last midterm (MEDSL precinct returns of the certified results, CC0)
votes = "ne_gov_2022"        # 2022 governor two-party votes

[model]                    # brunder.nowcast.Params; GA 2022/2024 replays without a vote-type split (this feed has none), as SC/FL
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08

[count]                    # brunder.us.CountRules
# NE counties count early ballots on election night; the service gives precincts reporting per county and no
# vote-type split: f = counted / expected votes, capped at 0.95 until every precinct reported, then 98% counted;
# complete counties re-scale the rest (learned turnout).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = false

[markets.polymarket]
event = "nebraska-governor-winner-2026"
market = "will-the-democrats-win-the-nebraska-governor-race-in-2026"
question = "Will the Democrats win the Nebraska governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
