# US midterms 2026-11-03, Georgia governor: model v4 (SECONDARY; the primary stays us2026_ga_gov_v3).
# Identical to us2026_ga_gov_v3.toml (sha256 5c35031e4c07ef59513832802065076b361f8e14206449ecd0310925e2f704bd) except the expected vote per county:
# 2024 president two-party votes x the county's own 2022/2020 midterm drop-off (relative to its state,
# capped x0.61-x1.65; state flat ratio where missing), with swing_prior_mean re-centred on those
# weights (the v2 definition, so v4 still starts at the poll average). docs/us_model_analysis.md.
id = "us2026_ga_gov_v4"
role = "secondary"

[election]
eid = "us2026"
race_id = "ga-gov"
name = "Georgia governor"
state = "ga"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "ga"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Keisha Lance Bottoms", color = "#1f5fbf" }
b = { party = "REP", name = "Rick Jackson", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "ga_gov_2022"        # 2022 governor (Abrams v Kemp): same office, last midterm
votes = "ga_gov_2022"        # 2022 governor two-party votes
poll_avg = 0.4934           # two-party Dem share, weighted average of 8 polls
poll_sd = 0.0397            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 8
poll_last = "2026-10-23"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.4337        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py)
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0404   # poll_avg - prior statewide share 0.4530 weighted by v4's expected votes
swing_prior_sd = 0.0334      # historical RMSE of a poll average with 8 polls (brunder.us.POLL_SD_BINS)
count_scaled_terms = true   # tau / between-region terms scale in with the counted votes

[count]                    # brunder.us.CountRules
# As ga-sen.
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.64
expected_votes = "data_public/us2026_expected_votes_v4.csv"   # 2024 president x own 2022/2020 drop-off (secondary model)
expected_votes_level = "file"

[markets.polymarket]
event = "georgia-governor-winner-2026"
market = "will-the-democrats-win-the-georgia-governor-race-in-2026"
question = "Will the Democrats win the Georgia governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
