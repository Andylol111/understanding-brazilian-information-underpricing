# Poland, presidential runoff 2025-06-01 (Trzaskowski vs Nawrocki). RETROSPECTIVE REPLAY, NOT PRE-REGISTERED, not
# registered: written on 2026-10-30, after the election, after the archived PKW count versions were downloaded and
# decoded, and after a first model run on the runoff night with default settings (an earlier voivodeship-level version
# of the model: raw tally and nowcast defaults, no settings chosen). The settings below come only from the 2025 round-1
# count night (31 archived PKW versions, 18 May; an earlier election than the runoff) with the 2020 round-1 result as
# prior: analysis/pl_calibrate.py -> results/poland/calibration.json ("runoff_from_2025r1_night"). No runoff count
# went into any setting. New versions get new files; do not edit the settings in this one.
id = "pl2025r2_v1"
election = "Poland, presidential runoff, 2025-06-01; polls closed 19:00 UTC (21:00 CEST)"
round = 2
poll_close_utc = "2025-06-01T19:00:00Z"

[model]                      # brunder.nowcast.Params over 128 cells (16 voivodeships x 8 gmina-size classes) + abroad
tau = 0.005                  # smallest tau with 90% coverage >= 0.90 over the 14 round-1 night frames at 1-95% counted
sigma_mun0 = 0.06            # nowcast default, held fixed (see analysis/pl_calibrate.py)
kappa = 100000.0             # lowest MAE at that tau (round-1 night)
rho = 0.8                    # same
nu_mun = 20.0                # nowcast default
sigma_uf0 = 0.03             # nowcast default
nu_uf = 5.0                  # nowcast default

[prior]                      # 2020 runoff, Trzaskowski vs Duda, by cell (brunder.poland.prior)
source = "https://prezydent20200628.pkw.gov.pl/prezydent20200628/data/2/csv/wyniki_gl_na_kand_po_gminach_csv.zip"

[prices]
start_utc = "2025-05-31T04:00:00Z"
end_utc = "2025-06-02T08:00:00Z"   # before the markets resolved (Polymarket 08:55 UTC)

