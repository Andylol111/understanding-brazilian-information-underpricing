# Germany 2025 Bundestag election replay (RETROSPECTIVE, NOT PRE-REGISTERED: written after the election night, with the
# 2025 result and the market resolutions known to the author). Model settings come only from the 2021 night (Internet
# Archive copies of the Bundeswahlleiter's 2021 result pages, prior = 2017 result on the 2021 constituencies; see
# analysis/de_calibrate.py -> results/germany/calibration_2021.json). No 2025 count went into kappa, theta0, sd_a, sd_b,
# sd_floor or the correlations. bsw_c and bsw_rho are judgments (BSW did not exist before 2024): see docs/germany.md.
id = "de2025_v1"
election = "Germany, Bundestag election, 2025-02-23; polls closed 17:00 UTC (18:00 CET)"
poll_close_utc = "2025-02-23T17:00:00Z"
night_end_utc = "2025-02-24T06:00:00Z"
draws = 20000
seed = 20250223

[model]                      # brunder.germany.Params
kappa = 3000000.0              # 2021: smallest mean squared share error of the six big parties (grid 3e5..3e7)
theta0 = 1000000.0           # default, not tuned
bsw_c = 0.3                  # judgment, not fitted: BSW prior share = 0.3 * (AfD + Die Linke) 2021 share (BSW is a Linke split courting AfD voters)
bsw_rho = -0.1               # judgment: correlation of BSW's projection error with every other party's
sd_a = 0.2                  # 2021: smallest value of the grid with pooled 90% coverage >= 0.90 (0.948)
sd_b = 0.9                  # 2021: slope of log|error| on log(share of votes still to come)
sd_floor = 0.0001           # 2021: largest |last national page - final| second-vote share difference, floored at 0.0001

[calibration]
corr_parties = ["Union", "AfD", "SPD", "GRÜNE", "Die Linke", "FDP", "Übrige"]
corr = [[1.0, -0.261, -0.467, -0.23, -0.548, -0.142, 0.346], [-0.261, 1.0, -0.018, -0.421, 0.174, 0.212, -0.316], [-0.467, -0.018, 1.0, 0.096, 0.204, -0.112, -0.532], [-0.23, -0.421, 0.096, 1.0, -0.017, -0.391, -0.181], [-0.548, 0.174, 0.204, -0.017, 1.0, -0.007, -0.471], [-0.142, 0.212, -0.112, -0.391, -0.007, 1.0, -0.152], [0.346, -0.316, -0.532, -0.181, -0.471, -0.152, 1.0]]

[prior]                      # 2021 result on the 2025 constituencies, published by the Bundeswahlleiterin before the election
file = "germany/open/btwkr25_umrechnung_btw21.csv"
electorate_file = "germany/open/kerg2.csv"   # Wahlberechtigte per Wahlkreis (known before polling day), not any vote count

[prices]
start_utc = "2025-02-23T14:00:00Z"
end_utc = "2025-02-24T12:00:00Z"

