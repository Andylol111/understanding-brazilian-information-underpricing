# SENSITIVITY RUN, not the headline: the runoff replay with the settings the 2020 simulation chose (the same
# earlier-election source as the round-1 config) instead of the round-1 night. Everything else as pl2025r2_v1.toml.
# Same status: retrospective, not pre-registered, not registered.
id = "pl2025r2_sim2020_v1"
election = "Poland, presidential runoff, 2025-06-01; polls closed 19:00 UTC (21:00 CEST); settings from the 2020 simulation"
round = 2
poll_close_utc = "2025-06-01T19:00:00Z"

[model]
tau = 0.04
sigma_mun0 = 0.06
kappa = 100000.0
rho = 0.5
nu_mun = 20.0
sigma_uf0 = 0.03
nu_uf = 5.0

[prior]                      # 2020 runoff, Trzaskowski vs Duda, by cell (brunder.poland.prior)
source = "https://prezydent20200628.pkw.gov.pl/prezydent20200628/data/2/csv/wyniki_gl_na_kand_po_gminach_csv.zip"

[prices]
start_utc = "2025-05-31T04:00:00Z"
end_utc = "2025-06-02T08:00:00Z"   # before the markets resolved (Polymarket 08:55 UTC)

# ---- dashboard races. A = Trzaskowski. Band markets: margin of victory in points of valid votes.
