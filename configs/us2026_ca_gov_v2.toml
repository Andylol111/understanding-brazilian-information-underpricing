# US midterms 2026-11-03, California governor: model v2. Identical to us2026_ca_gov_v1.toml (sha256 b6f976468cd0ba4456ab2a0f4039adb3e6f1fef7cf5fddaed2da05204e877a15)
# except a prior on the statewide swing from the polls ([model] swing_prior_*; brunder.nowcast): the
# swing is the precision-weighted mix of the poll prior and the swing in counted votes, so the polls
# lead early and the count takes over. Poll average frozen here (rule docs/us_midterms.md#polls;
# VoteHub polls, CC BY 4.0, data built 2026-10-29T00:09:07Z); nothing is fetched on the night. v1 and v2 are both
# registered and scored.
id = "us2026_ca_gov_v2"

[election]
eid = "us2026"
race_id = "ca-gov"
name = "California governor"
state = "ca"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "ca"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T04:00:00Z"
a = { party = "DEM", name = "Xavier Becerra", color = "#1f5fbf" }
b = { party = "REP", name = "Steve Hilton", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "ca_gov_2022"        # 2022 governor (Newsom v Dahle): same office, last midterm, top-two D v R
votes = "ca_gov_2022"        # 2022 governor two-party votes (midterm turnout pattern)
poll_avg = 0.629           # two-party Dem share, weighted average of 5 polls
poll_sd = 0.0397            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 5
poll_last = "2026-10-24"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.9994        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA no-split value 0.06 widened for a weeks-long count (judgment, not calibrated)
tau = 0.08
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.0372   # poll_avg - prior statewide share 0.5918 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0397      # = poll_sd

[count]                    # brunder.us.CountRules
# CA counts vote-by-mail and provisional ballots for weeks: precincts reporting says nothing about
# ballots left, so f = counted / expected (2022 governor two-party votes × 1.0), capped at 0.90.
turnout_ratio = 1.0
f_max = 0.9
f_complete = 0.0
use_outstanding = false
learn_turnout = false

[markets.polymarket]
event = "california-governor-election-2026"
market = "will-xavier-becerra-win-the-california-governor-election-in-2026"
question = "Will Xavier Becerra win the California Governor Election in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
