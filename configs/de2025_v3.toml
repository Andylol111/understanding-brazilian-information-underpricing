# Germany 2025 v3 SENSITIVITY (RETROSPECTIVE, NOT PRE-REGISTERED: designed after the 2025 result and the market resolutions were
# known, chosen after the result was known). v1 stays the headline. Changes against v1, all selected on EARLIER nights only by the rule
# written in docs/germany.md ("Sensitivity v3") before analysis/de_calibrate_v3.py ran -> results/germany/calibration_v3.json:
#   (a) [poll]: the 2021 result on the 2025 constituencies is tilted to the mean of the 25 national polls whose fieldwork ended
#       2025-02-10..2025-02-22 (14 days before the election; Wikipedia "Opinion polling for the 2025 German federal election", CC BY-SA,
#       data_public/de_polls_2025.csv) by proportional swing per party; BSW pattern 0.3 x (AfD + Linke) scaled to its poll.
#   (b) prior_votes: the national swing is shrunk to zero by this many pseudo-votes, so the poll's weight fades as the count arrives.
#   (c) kappa, sd_a, sd_b, correlations re-chosen on 2021 (real archived order) and 2017 (simulated orders), each with the same
#       poll-tilted prior built from its own polls; sd_a = the larger of the grid rule (0.08) and the historical 14-day-poll RMS log
#       error of 2013, 2017, 2021 (0.1253), so that before the first page the sd is the poll error.
#   (d) a frame before any count (poll close) carries P from the prior alone. No exit poll, no 2025 count and no 2025 price is an input.
# bsw_c, bsw_rho, theta0, sd_floor and the markets are v1's.
id = "de2025_v3"
election = "Germany, Bundestag election, 2025-02-23; polls closed 17:00 UTC (18:00 CET)"
poll_close_utc = "2025-02-23T17:00:00Z"
night_end_utc = "2025-02-24T06:00:00Z"
draws = 20000
seed = 20250223

[model]                      # brunder.germany.Params
kappa = 30000000.0             # grid 3e5..3e7, lowest mean absolute share error on 2021 + 2017 (grid edge)
theta0 = 1000000.0           # as v1
prior_votes = 10000000.0        # grid 0..1e7, lowest mean absolute share error (grid edge): weight of the poll-tilted prior, in pseudo-votes
bsw_c = 0.3                  # judgment, as v1: BSW pattern 0.3 * (AfD + Linke) 2021, scaled to its poll
bsw_rho = -0.1               # as v1
sd_a = 0.125                  # max(grid rule 0.08, historical poll RMS log error 0.1253)
sd_b = 0.992                 # pooled slope of log relative error on log(share of votes still to come), 2021 + 2017
sd_floor = 0.0001

[calibration]
corr_parties = ["Union", "AfD", "SPD", "GRÜNE", "Die Linke", "FDP", "Übrige"]
corr = [[1.0, 0.197, -0.287, -0.501, -0.377, -0.143, 0.135], [0.197, 1.0, -0.446, -0.515, -0.168, 0.033, 0.243], [-0.287, -0.446, 1.0, 0.157, -0.065, -0.241, -0.546], [-0.501, -0.515, 0.157, 1.0, 0.084, -0.072, -0.3], [-0.377, -0.168, -0.065, 0.084, 1.0, -0.258, -0.192], [-0.143, 0.033, -0.241, -0.072, -0.258, 1.0, 0.057], [0.135, 0.243, -0.546, -0.3, -0.192, 0.057, 1.0]]

[poll]                       # national Zweitstimmen poll average, polls ending 2025-02-10..2025-02-22 (n = 25)
"Union" = 0.29956
"AfD" = 0.20488
"SPD" = 0.15284
"GRÜNE" = 0.12908
"Die Linke" = 0.06920
"FDP" = 0.04260
"BSW" = 0.04544
"Übrige" = 0.05640

[prior]                      # 2021 result on the 2025 constituencies, published by the Bundeswahlleiterin before the election
file = "germany/open/btwkr25_umrechnung_btw21.csv"
electorate_file = "germany/open/kerg2.csv"   # Wahlberechtigte per Wahlkreis (known before polling day), not any vote count

