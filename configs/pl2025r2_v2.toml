# Poland, presidential runoff 2025-06-01: v2 = SENSITIVITY, NOT THE HEADLINE. CHOSEN AFTER THE 2025 RUNOFF RESULT WAS
# KNOWN: v1 (pl2025r2_v1.toml, settings from the 2025 round-1 night alone) was overconfident on the runoff (its 90% band
# held the final share in 46% of minutes), and this pooling was done because of that. It is therefore not a forward
# test. RETROSPECTIVE, NOT PRE-REGISTERED, not registered. The inputs are only nights before 2025-06-01: the real 2025
# round-1 night and the 2020 runoff counted in simulated order (no other earlier night has count-night versions in the
# Internet Archive, see docs/poland.md). Rule (analysis/pl_calibrate_pooled.py, written before the run): tau = the
# smallest value whose pooled 90% coverage (mean over nights, each night equal) is >= 0.90; kappa, rho = lowest pooled
# MAE at that tau. Result in results/poland/calibration_pooled.json: tau 0.03, kappa 100,000, rho 0.5, pooled coverage
# 0.917 (night 1.00, simulation 0.83). Round 1 has no v2: its settings already come from the earlier-election source
# only (the 2020 simulation), and the 2025 round-1 night may not be used for it.
# v1 is not edited. New versions get new files.
id = "pl2025r2_v2"
election = "Poland, presidential runoff, 2025-06-01; polls closed 19:00 UTC (21:00 CEST); pooled settings (sensitivity)"
round = 2
poll_close_utc = "2025-06-01T19:00:00Z"

[model]
tau = 0.03
sigma_mun0 = 0.06
kappa = 100000.0
rho = 0.5
nu_mun = 20.0
sigma_uf0 = 0.03
nu_uf = 5.0

[prior]                      # 2020 runoff, Trzaskowski vs Duda, by cell (brunder.poland.prior)
source = "https://prezydent20200628.pkw.gov.pl/prezydent20200628/data/2/csv/wyniki_gl_na_kand_po_gminach_csv.zip"

[prices]
start_utc = "2025-05-31T04:00:00Z"
end_utc = "2025-06-02T08:00:00Z"   # before the markets resolved (Polymarket 08:55 UTC)

