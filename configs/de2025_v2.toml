# Germany 2025 v2 sensitivity (RETROSPECTIVE, NOT PRE-REGISTERED: chosen after the 2025 result and market resolutions
# were known). It applies the fixed common calibration rule to usable earlier German nights. Internet Archive searches
# found a replayable 2021 night, only one stamped result page in 2017, and none in 2013; therefore calibration still uses
# 2021 alone. See docs/germany.md and analysis/de_calibrate_v2.py -> results/germany/calibration_v2.json. No 2025 count
# enters the selected settings. bsw_c and bsw_rho remain judgments because BSW did not exist before 2024.
id = "de2025_v2"
election = "Germany, Bundestag election, 2025-02-23; polls closed 17:00 UTC (18:00 CET)"
poll_close_utc = "2025-02-23T17:00:00Z"
night_end_utc = "2025-02-24T06:00:00Z"
draws = 20000
seed = 20250223

[model]                      # brunder.germany.Params
kappa = 30000000.0             # lowest mean absolute share error on the usable earlier night (existing grid)
theta0 = 1000000.0           # default, not tuned
bsw_c = 0.3                  # judgment, not fitted: BSW prior share = 0.3 * (AfD + Die Linke) 2021 share (BSW is a Linke split courting AfD voters)
bsw_rho = -0.1               # judgment: correlation of BSW's projection error with every other party's
sd_a = 0.2                  # smallest grid value with pooled coverage >= .90 and worst-night >= .75 (.954)
sd_b = 0.931                # pooled slope of log relative error on log(share of votes still to come)
sd_floor = 0.0001           # 2021: largest |last national page - final| second-vote share difference, floored at 0.0001

[calibration]
corr_parties = ["Union", "AfD", "SPD", "GRÜNE", "Die Linke", "FDP", "Übrige"]
corr = [[1.0, -0.247, -0.443, -0.251, -0.541, -0.114, 0.326], [-0.247, 1.0, -0.053, -0.413, 0.202, 0.165, -0.344], [-0.443, -0.053, 1.0, 0.112, 0.166, -0.134, -0.503], [-0.251, -0.413, 0.112, 1.0, -0.042, -0.361, -0.151], [-0.541, 0.202, 0.166, -0.042, 1.0, -0.014, -0.469], [-0.114, 0.165, -0.134, -0.361, -0.014, 1.0, -0.15], [0.326, -0.344, -0.503, -0.151, -0.469, -0.15, 1.0]]

[prior]                      # 2021 result on the 2025 constituencies, published by the Bundeswahlleiterin before the election
file = "germany/open/btwkr25_umrechnung_btw21.csv"
electorate_file = "germany/open/kerg2.csv"   # Wahlberechtigte per Wahlkreis (known before polling day), not any vote count

[prices]
start_utc = "2025-02-23T14:00:00Z"
