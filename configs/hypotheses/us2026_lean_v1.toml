id = "us2026_lean_v1"
kind = "us_state_polling_miss_lean_level"
status = "unregistered"
origin = "analysis/us_drift.py; docs/us_drift.md. Written 2026-10-30 from data public before 2026-10-30."
weak_historical_signal = false
hypothesis = """Polls understate the dominant party of lopsided states: relative to the cycle-wide polling
miss, races in states whose presidential lean is more Democratic have a more Democratic
certified-minus-poll-average miss, and more Republican states a more Republican one."""
selection_note = "Chosen AFTER seeing the 2006-2024 results. It was in the first candidate list of the drift analysis, won it, and was then removed from the drift candidates because it is a level, not a drift; it is registered separately here as its own hypothesis. Its historical numbers are therefore in-sample selected."

[data]
poll_source = "site/data/us2026/hub/polls.json (VoteHub Polling API, CC BY 4.0), built 2026-10-29"
poll_average = "v3 rule (sqrt n weight, 14-day half-life, 45-day window, 25 % pollster cap) as of 2026-11-02"
measure_data_cutoff = "MEDSL state presidential return 2024 (certified; CC0): the last election before 2026"
historical_fit = "538 raw_polls 2006-2022 + 538 2024 poll files (CC BY 4.0); MEDSL certified results (CC0)"
race_universe = "the 48 hub Senate/governor races below: a poll in the 45-day window, D + R >= 75 % of the poll"

[measure]
name = "pres_lean"
description = "latest pre-election presidential two-party D lean vs nation"
formula = "lean = L[2024]; L = state two-party D share minus national two-party D share, presidential, points"
target = "miss = certified two-party D share - poll_avg_d2 (points); relative miss = miss - mean miss of scored races"
prediction = "historical_beta x (lean - mean lean of the 48 races); cycle-fixed-effects slope, 2006-2024"
units = "points of two-party Democratic share; positive = polls understated the Democrat"
historical_beta = 0.076263
historical_beta_ci95_cycle_bootstrap = [0.046432, 0.102073]
historical_loco_residual_sd = 2.290465
historical_races = 710
historical_cycles = 10
loco_delta_rmse = -0.1047
loco_delta_rmse_ci95 = [-0.1870, -0.0080]
loco_sign_agreement = 0.6127
cross_era_delta_rmse = -0.0975
cross_era_delta_rmse_ci95 = [-0.1732, -0.0081]
era_2006_14_loco_delta_rmse = -0.0436
era_2016_24_loco_delta_rmse = -0.1581
caveat = "Small: predicted relative misses reach about +-1.4 points in the most lopsided states against a 2.3-point race residual sd; the gain is 0.1 point of RMSE. Registered as a direction test only. Lean and drift are uncorrelated among these 48 races (r = -0.01), so the two tests are nearly independent."

[primary]
test = "sign agreement, one-sided exact binomial (H0 p = 0.5, H1 p > 0.5) over scored polled races"
success = "sign(miss_points) == sign(relative miss)"
ties = "exclude a race whose relative miss is exactly 0.00 points at two decimals"
scored_races = "every race below with a certified result. d2 = certified votes of the hub D-side candidate / (D-side + hub opponent), the same pair as poll_avg_d2 (e.g. NE Senate: Osborn vs Ricketts); a race whose pair is not on the certified ballot is dropped and the drop is reported"
report = "agreements k, signed races n, one-sided binomial p-value P(X >= k | n, 0.5)"
family = ["us2026_drift_v1", "us2026_lean_v1"]
family_correction = "Holm"
family_alpha = 0.05
scored_after = "certification of every scored race"
score_command = "uv run python analysis/us_drift.py score certified.csv --measure pres_lean  # columns race, d2"
dependence_note = "Senate and governor races of one state share the same lean and about half their error (corr 0.55): the per-race binomial is anti-conservative; the state-collapsed test below is the robustness check."

[secondary]
tests = ["same sign test with each state counted once (majority of its races; split states dropped)",
         "RMSE of miss_points versus zero against the relative miss", "coverage of the 90 % intervals"]

