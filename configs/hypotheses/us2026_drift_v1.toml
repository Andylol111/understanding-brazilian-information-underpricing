id = "us2026_drift_v1"
kind = "us_state_polling_miss_drift"
status = "unregistered"
origin = "analysis/us_drift.py; docs/us_drift.md. Written 2026-10-30 from data public before 2026-10-30."
weak_historical_signal = true
hypothesis = """Polls under-capture long-run state partisan drift: relative to the cycle-wide polling miss,
races in states whose presidential lean has been moving toward the Democrats have a more Democratic
certified-minus-poll-average miss, and states moving toward the Republicans a more Republican one."""

[data]
poll_source = "site/data/us2026/hub/polls.json (VoteHub Polling API, CC BY 4.0), built 2026-10-29"
poll_average = "v3 rule (sqrt n weight, 14-day half-life, 45-day window, 25 % pollster cap) as of 2026-11-02"
measure_data_cutoff = "MEDSL state presidential returns 2012, 2016, 2020, 2024 (certified; CC0)"
historical_fit = "538 raw_polls 2006-2022 + 538 2024 poll files (CC BY 4.0); MEDSL certified results (CC0)"
race_universe = "the 48 hub Senate/governor races below: a poll in the 45-day window, D + R >= 75 % of the poll"

[measure]
name = "drift_combo"
description = "pre-specified combination: mean of d1, d2/2 and d3/3 (points per presidential cycle)"
formula = "drift = mean(L[p] - L[p-4], (L[p] - L[p-8]) / 2, (L[p] - L[p-12]) / 3), p = last presidential election before the race (2024 for 2026); L = state minus national two-party D share, presidential, points"
target = "miss = certified two-party D share - poll_avg_d2 (points); relative miss = miss - mean miss of scored races"
prediction = "historical_beta x (drift - mean drift of the 48 races); cycle-fixed-effects slope, 2006-2024"
units = "points of two-party Democratic share; positive = polls understated the Democrat"
historical_beta = 0.338899
historical_beta_ci95_cycle_bootstrap = [0.198443, 0.458898]
historical_loco_residual_sd = 2.322852
historical_races = 710
historical_cycles = 10
loco_delta_rmse = -0.0724
loco_delta_rmse_ci95 = [-0.1349, -0.0054]
loco_sign_agreement = 0.5761
cross_era_delta_rmse = -0.0280
cross_era_delta_rmse_ci95 = [-0.0858, 0.0429]
era_2006_14_loco_delta_rmse = -0.0158
era_2016_24_loco_delta_rmse = -0.1635
delta_rmse_over_lean_level = -0.0176
delta_rmse_over_lean_level_ci95 = [-0.0509, 0.0145]
caveat = "Weak: predicted relative misses are +-0.6 points against a 2.3-point race residual sd; the gain is concentrated in 2016-24 and mostly shared with the lean level. Registered as a direction test only."

[primary]
test = "sign agreement, one-sided exact binomial (H0 p = 0.5, H1 p > 0.5) over scored polled races"
success = "sign(miss_points) == sign(relative miss)"
ties = "exclude a race whose relative miss is exactly 0.00 points at two decimals"
scored_races = "every race below with a certified result. d2 = certified votes of the hub D-side candidate / (D-side + hub opponent), the same pair as poll_avg_d2 (e.g. NE Senate: Osborn vs Ricketts); a race whose pair is not on the certified ballot is dropped and the drop is reported"
report = "agreements k, signed races n, one-sided binomial p-value P(X >= k | n, 0.5)"
family = ["us2026_drift_v1", "us2026_lean_v1"]
family_correction = "Holm"
family_alpha = 0.05
scored_after = "certification of every scored race"
score_command = "uv run python analysis/us_drift.py score certified.csv --measure drift_combo  # columns race, d2"
dependence_note = "Senate and governor races of one state share drift and about half their error (corr 0.55): the per-race binomial is anti-conservative; the state-collapsed test below is the robustness check."

[secondary]
tests = ["same sign test with each state counted once (majority of its races; split states dropped)",
         "RMSE of miss_points versus zero against the relative miss", "coverage of the 90 % intervals"]

