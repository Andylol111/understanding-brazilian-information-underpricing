# US midterms 2026-11-03, Texas Senate. Frozen before polls close (first close 2026-11-03 23:00 UTC); the integrator
# registers it (prereg/registry.jsonl). Nothing here was chosen on 2026 count data. Settings and evidence:
# docs/us_midterms.md. Live/replay: uv run brunder us live|export configs/us2026_*_v1.toml
id = "us2026_tx_sen_v1"

[election]
eid = "us2026"
race_id = "tx-sen"
name = "Texas Senate"
state = "tx"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "tx"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T01:00:00Z"
a = { party = "DEM", name = "James Talarico", color = "#1f5fbf" }
b = { party = "REP", name = "Ken Paxton", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "tx_sen_2024"        # 2024 Senate (Allred v Cruz): same office, most recent
votes = "tx_gov_2022"        # 2022 governor two-party votes (TX had no 2022 Senate race)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py)
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08

[count]                    # brunder.us.CountRules
# TX counts early in-person and mail ballots first and nearly everything on election night: once every
# polling place in a county reported, 98% of its vote is assumed in; those counties re-scale the
# expected vote of the rest (learned turnout).
# vote_type: counties split into early+mail and Election Day units (the feed reports early votes);
# early_share = 0.6 (assumption: no TX county vote-type history in the sources used).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.6

[markets.polymarket]
event = "texas-senate-election-winner"
market = "will-the-democrats-win-the-texas-senate-race-in-2026"
question = "Will the Democrats win the Texas Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
