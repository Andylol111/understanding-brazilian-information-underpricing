# US midterms 2026-11-03, North Carolina Senate: model v2. Identical to us2026_nc_sen_v1.toml (sha256 38c74464faeadb694f624e45b1f6081040d139656ee4203be6d48d1a9a274c55)
# except a prior on the statewide swing from the polls ([model] swing_prior_*; brunder.nowcast): the
# swing is the precision-weighted mix of the poll prior and the swing in counted votes, so the polls
# lead early and the count takes over. Poll average frozen here (rule docs/us_midterms.md#polls;
# VoteHub polls, CC BY 4.0, data built 2026-10-29T18:33:58Z); nothing is fetched on the night. v1 and v2 are both
# registered and scored.
id = "us2026_nc_sen_v2"

[election]
eid = "us2026"
race_id = "nc-sen"
name = "North Carolina Senate"
state = "nc"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "nc"                    # brunder.us.FEEDS (NCSBE ENR county.txt + results_<id>.txt; resolver --ncsbe)
poll_close_utc = "2026-11-04T00:30:00Z"
a = { party = "DEM", name = "Roy Cooper", color = "#1f5fbf" }
b = { party = "REP", name = "Michael Whatley", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "nc_sen_2022"        # 2022 Senate (Beasley v Budd): same office, last midterm (NCSBE certified precinct results)
votes = "nc_sen_2022"        # 2022 Senate two-party votes
poll_avg = 0.5603           # two-party Dem share, weighted average of 9 polls
poll_sd = 0.0397            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 9
poll_last = "2026-10-25"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.9355        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py)
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0768   # poll_avg - prior statewide share 0.4835 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0397      # = poll_sd

[count]                    # brunder.us.CountRules
# NC reports one-stop early and mail ballots first after polls close, then Election Day precincts (NCSBE ENR
# reports each county's one-stop / absentee / Election Day / provisional votes and precincts reported), the same
# order as GA: vote_type on, a county with every precinct reported is 98% counted, learned turnout.
# early_share = 0.46 = NC 2022 Senate one-stop + mail share of the two-party vote (NCSBE ENR 2022, county files).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.46

[markets.polymarket]
event = "north-carolina-senate-election-winner"
market = "will-the-democrats-win-the-north-carolina-senate-race-in-2026"
question = "Will the Democrats win the North Carolina Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
