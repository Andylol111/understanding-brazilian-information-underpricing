[model]
# Chosen by analysis/es_calibrate.py on the three EARLIER elections (2016->2019, 2019->2019, 2019->2023) with simulated
# count orders; see docs/spain.md. own_votes: a province's own counted votes count against the prior composition as
# if the prior were 10,000 votes (the counted composition is trusted almost fully). swing_votes: pseudo-votes of prior
# for the pooled national swing. sd_votes/tau_nat/tau_prov: the error model (narrowest 90% interval that covered
# >= 90% of true shares from 20% counted, on all three elections). cera_frac: abroad votes in 2023 (205,553 of
# 24,688,087 valid; not in the night count). precount_sd: log error of the poll-median prior. The last-week poll median
# missed by 0.076 (RMS log error, 10 party-elections in 2019-2023, analysis/es_poll_error.py); the 2026 polls are 5-7
# weeks old, so 0.12 is used (a judgement, not a fit).
own_votes = 10000.0
swing_votes = 1000000.0
sd_votes = 1000000.0
turnout_votes = 20000.0
cera_frac = 0.0083
tau_nat = 0.06
precount_sd = 0.12
tau_prov = 0.12
draws = 4000

[feed]
# Elecciones 29N republishes the Interior Ministry's provisional count as public JSON (no key; reuse with the source named).
# The Ministry's own repository is a media-only service behind a login, which this project does not use.
# The manifest gives the current publication number (seq); each seq has a national file and one file per province.
base = "https://datos.generales29n.com/v1/congreso-2026-11"
interval_seconds = 30
request_delay_seconds = 1.1

[markets]
polymarket_events = [
  "spain-general-election-winner",
  "spain-general-election-2nd-place",
  "spain-general-election-3rd-place",
  "spain-general-election-pp-vox-get-50-of-vote",
]
kalshi_events = [
  "KXSPAINPARLI-27",
  "KXSPAIN2ND-26NOV29-2",
  "KXSPAIN3RD-26NOV29-3",
  "KXVOTESPAIN-26NOV29PPVOX",
  "KXVOTESPAIN-26NOV29PP",
  "KXVOTESPAIN-26NOV29VOX",
  "KXVOTESPAIN-26NOV29PSOE",
]

