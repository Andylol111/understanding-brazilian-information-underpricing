# FROZEN 2026-10-31, before the Spanish count. Evidence label: FORWARD once registered (not registered yet).
# Integrator: commit and hash-register this file before the first results at 2026-11-29T20:00:00Z.
# Settings use only official 2016-2023 Congress results, polls published before this freeze, and the
# simulated-count calibration in analysis/es_calibrate.py (results in docs/spain.md). Do not edit after registration;
# later changes need a new versioned file.
id = "es2026_v1"
seed = 20261129

[election]
eid = "es2026"
name = "Spain general election 2026"
date = "2026-11-29"
tz = "Europe/Madrid"
# First results are published when the polls close in the Canary Islands: 20:00 there = 21:00 in Madrid = 20:00 UTC.
poll_close_utc = "2026-11-29T20:00:00Z"

[prior]
# 2023 province results (official, final) are the base; the poll medians below set the national level.
date = "2023-07-23"
public_file = "data_public/es_congreso_province_2016_2023.csv"

[poll]
# Median of the latest poll of each pollster published before the freeze (nine polls; a missing figure is skipped).
# Figures are shares of the vote in percent. Sources: https://www.datosclaros.es/resultados-29n/ (table of the last
# polls before the ban) and ABC, 2026-10-26 (Sigma Dos Frente Amplio 7.2; GAD3 Podemos 2.3; CIS Podemos 3.1).
# The CIS is kept: the median ignores outliers, and dropping a pollster by hand after seeing the numbers would be a choice.
[[poll.polls]]
pollster = "Sigma Dos (El Mundo)"
published = "2026-10-19"
pp = 31.5
psoe = 25.3
vox = 19.5
fa = 7.2
url = "https://www.abc.es/espana/encuestas-elecciones-generales-29n-resultados-psoe-pp-20261026051500-nt.html"

