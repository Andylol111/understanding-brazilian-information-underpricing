# Replay of the 2026 first-round count: "who finishes first" (Lula − Flávio margin > 0),
# national and per state, against Polymarket's first-round markets.
[election]
cycle = "ele2026"
ele = 6257
cargo = 1
race = "margin"          # (Lula − Flávio) / valid > 0
cand_a = "13"
cand_b = "22"

[prior]                  # 2022 first round, same party numbers: Lula (13) vs Bolsonaro (22)
kind = "open"
year = 2022
round = 1

[model]                  # margin scale: σ_swing = between-state sd of the PT−PL margin swing 2018→2022
kappa = 200000
sigma_swing = 0.090
sigma_within = 0.090
tau = 0.02               # 1 pt on a share ≈ 2 pt on a margin; not yet calibrated

[replay]
year = 2026
round = 1

[trade]
min_edge = 0.05
half_spread = 0.01
fee_rate = 0.04          # politics taker fee rate; applied as rate·p·(1 − p)

[markets.national]
event = "brazil-presidential-election-first-round-winner"
market = "will-lula-win-the-most-votes-in-the-first-round-of-the-2026-brazil-presidential-election"

[markets.states.ac]
event = "brazil-presidential-election-first-round-1st-place-in-acre"
market = "will-lula-win-the-most-votes-in-the-next-brazil-presidential-election-from-acre"

