# US midterms 2026-11-03, South Carolina Senate: model v3. Identical to us2026_sc_sen_v2.toml (sha256 36e85225ea619164dd539020bacc996ed272ae2eb7ec3ffdff7cca45f6490474)
# except the pre-count uncertainty: swing_prior_sd = the historical error of a poll average with this
# many polls (538 raw_polls 2016-2022, CC BY 4.0; analysis/us_polls.py errorbins), and
# count_scaled_terms = true, so before any vote the statewide uncertainty is that poll error alone and
# the reporting-order / between-region terms grow with the counted votes (brunder.nowcast). Earlier
# versions stay registered and scored.
id = "us2026_sc_sen_v3"

[election]
eid = "us2026"
race_id = "sc-sen"
name = "South Carolina Senate"
state = "sc"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "sc"                    # brunder.us.FEEDS (Clarity ENR, eid resolved on the day)
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Annie Andrews", color = "#1f5fbf" }
b = { party = "REP", name = "Darline Graham", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "sc_sen_2022"        # 2022 Senate (Matthews v Scott): same office, last midterm (SC Election Commission)
votes = "sc_gov_2022"        # 2022 governor two-party votes (midterm turnout pattern)
poll_avg = 0.4946           # two-party Dem share, weighted average of 2 polls
poll_sd = 0.0407            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 2
poll_last = "2026-10-25"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.4468        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays without a vote-type split (the SC feed has none)
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.1239   # poll_avg - prior statewide share 0.3707 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0429      # historical RMSE of a poll average with 2 polls (brunder.us.POLL_SD_BINS)
count_scaled_terms = true   # tau / between-region terms scale in with the counted votes

[count]                    # brunder.us.CountRules
# SC counts early and absentee ballots on election night: once a county's status.json shows every precinct
# reported (PX = PY), 98% of its vote is assumed in; those counties re-scale the expected vote of the rest.
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true

[markets.polymarket]
event = "south-carolina-senate-election-winner"
market = "will-the-democrats-win-the-south-carolina-senate-race-in-2026"
question = "Will the Democrats win the South Carolina Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
