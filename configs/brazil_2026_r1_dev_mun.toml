# 2026 first round, municipal model: Lula vs Flávio top-two share by municipality (win first place if > ½).
# DEVELOPMENT set: parameters may be tuned here; the runoff replay (night_r2_v1) is pre-specified, not blind.
[election]
cycle = "ele2026"
ele = 6257
cargo = 1
race = "share"
cand_a = "13"
cand_b = "22"

[prior]                  # 2022 first round by municipality, Lula (13) vs Bolsonaro (22)
kind = "open"
year = 2022
round = 1

[model]
kind = "municipal"
tau = 0.015              # chosen on this development set: 93% of 90% intervals cover the final (1–95% counted)

[replay]
year = 2026
round = 1

[trade]
min_edge = 0.05
min_counted = 0.01
half_spread = 0.01
fee_rate = 0.04

