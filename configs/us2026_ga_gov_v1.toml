# US midterms 2026-11-03, Georgia governor. Frozen before polls close (first close 2026-11-03 23:00 UTC); the integrator
# registers it (prereg/registry.jsonl). Nothing here was chosen on 2026 count data. Settings and evidence:
# docs/us_midterms.md. Live/replay: uv run brunder us live|export configs/us2026_*_v1.toml
id = "us2026_ga_gov_v1"

[election]
eid = "us2026"
race_id = "ga-gov"
name = "Georgia governor"
state = "ga"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "ga"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Keisha Lance Bottoms", color = "#1f5fbf" }
b = { party = "REP", name = "Rick Jackson", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "ga_gov_2022"        # 2022 governor (Abrams v Kemp): same office, last midterm
votes = "ga_gov_2022"        # 2022 governor two-party votes

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py)
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08

[count]                    # brunder.us.CountRules
# As ga-sen.
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.64

[markets.polymarket]
event = "georgia-governor-winner-2026"
market = "will-the-democrats-win-the-georgia-governor-race-in-2026"
question = "Will the Democrats win the Georgia governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
