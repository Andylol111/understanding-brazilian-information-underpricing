# US midterms 2026-11-03, Pennsylvania governor: model v2. Identical to us2026_pa_gov_v1.toml (sha256 cc7d2f5c8a2cfe9590aa459d427b30e5edf3f6ba270a0c4a2dd4a9daea78f235)
# except a prior on the statewide swing from the polls ([model] swing_prior_*; brunder.nowcast): the
# swing is the precision-weighted mix of the poll prior and the swing in counted votes, so the polls
# lead early and the count takes over. Poll average frozen here (rule docs/us_midterms.md#polls;
# VoteHub polls, CC BY 4.0, data built 2026-10-29T18:33:58Z); nothing is fetched on the night. v1 and v2 are both
# registered and scored.
id = "us2026_pa_gov_v2"

[election]
eid = "us2026"
race_id = "pa-gov"
name = "Pennsylvania governor"
state = "pa"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "pa"                    # brunder.us.FEEDS (PA DoS election returns API, GetCountyBreak governor; plain --url)
poll_close_utc = "2026-11-04T01:00:00Z"
a = { party = "DEM", name = "Josh Shapiro", color = "#1f5fbf" }
b = { party = "REP", name = "Stacy Garrity", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "pa_gov_2022"        # 2022 governor (Shapiro v Mastriano): same office and candidate, last midterm (PA DoS certified county returns)
votes = "pa_gov_2022"        # 2022 governor two-party votes
poll_avg = 0.6228           # two-party Dem share, weighted average of 4 polls
poll_sd = 0.0405            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 4
poll_last = "2026-10-21"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.9988        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py), as NC
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0476   # poll_avg - prior statewide share 0.5752 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0405      # = poll_sd

[count]                    # brunder.us.CountRules
# PA counts mail ballots from 7 a.m. on Election Day and most counties post them soon after polls close; the feed
# gives each candidate's Election Day / mail-in / provisional votes by county, so vote_type is on (early = mail-in).
# The file has no precincts reporting (the separate county status messages are unreliable: Philadelphia 2022 still
# shows 89 of 1,703 divisions after certification), so no county is ever taken as complete: f = counted / expected
# (2022 governor two-party votes x 1.0), capped at 0.95, no learned turnout.
# early_share = 0.23 = PA 2022 governor mail-in share of the two-party vote (DoS county returns).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.0
use_outstanding = false
learn_turnout = false
vote_type = true
early_share = 0.23

[markets.polymarket]
event = "pennsylvania-governor-winner-2026"
market = "will-the-democrats-win-the-pennsylvania-governor-race-in-2026"
question = "Will the Democrats win the Pennsylvania governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
