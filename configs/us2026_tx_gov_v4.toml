# US midterms 2026-11-03, Texas governor: model v4 (SECONDARY; the primary stays us2026_tx_gov_v3).
# Identical to us2026_tx_gov_v3.toml (sha256 7343b4fa6b618bde4fd58225f9da87f8ae96e8012b0ebd5db7ccd610379f9038) except the expected vote per county:
# 2024 president two-party votes x the county's own 2022/2020 midterm drop-off (relative to its state,
# capped x0.61-x1.65; state flat ratio where missing), with swing_prior_mean re-centred on those
# weights (the v2 definition, so v4 still starts at the poll average). docs/us_model_analysis.md.
id = "us2026_tx_gov_v4"
role = "secondary"

[election]
eid = "us2026"
race_id = "tx-gov"
name = "Texas governor"
state = "tx"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "tx"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T01:00:00Z"
a = { party = "DEM", name = "Gina Hinojosa", color = "#1f5fbf" }
b = { party = "REP", name = "Greg Abbott", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "tx_gov_2022"        # 2022 governor (O'Rourke v Abbott): same office, last midterm
votes = "tx_gov_2022"        # 2022 governor two-party votes
poll_avg = 0.4858           # two-party Dem share, weighted average of 16 polls
poll_sd = 0.0393            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 16
poll_last = "2026-10-21"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.3595        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py)
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0483   # poll_avg - prior statewide share 0.4375 weighted by v4's expected votes
swing_prior_sd = 0.0228      # historical RMSE of a poll average with 16 polls (brunder.us.POLL_SD_BINS)
count_scaled_terms = true   # tau / between-region terms scale in with the counted votes

[count]                    # brunder.us.CountRules
# As tx-sen.
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.6
expected_votes = "data_public/us2026_expected_votes_v4.csv"   # 2024 president x own 2022/2020 drop-off (secondary model)
expected_votes_level = "file"

[markets.polymarket]
event = "texas-governor-winner-2026"
market = "will-the-democrats-win-the-texas-governor-race-in-2026"
question = "Will the Democrats win the Texas governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
