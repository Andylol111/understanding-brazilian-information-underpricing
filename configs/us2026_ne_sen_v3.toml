# US midterms 2026-11-03, Nebraska Senate: model v3. Identical to us2026_ne_sen_v2.toml (sha256 c0ab16c4cd38505763ef2b69d0776b35021400022b743fa4cc2971c693753747)
# except the pre-count uncertainty: swing_prior_sd = the historical error of a poll average with this
# many polls (538 raw_polls 2016-2022, CC BY 4.0; analysis/us_polls.py errorbins), and
# count_scaled_terms = true, so before any vote the statewide uncertainty is that poll error alone and
# the reporting-order / between-region terms grow with the counted votes (brunder.nowcast). Earlier
# versions stay registered and scored.
id = "us2026_ne_sen_v3"

[election]
eid = "us2026"
race_id = "ne-sen"
name = "Nebraska Senate"
state = "ne"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "ne"                    # brunder.us.FEEDS (NE SoS results web service GetMapData, race 13224; plain --url)
poll_close_utc = "2026-11-04T02:00:00Z"
a = { party = "PET", name = "Dan Osborn", color = "#6a4c93" }
b = { party = "REP", name = "Pete Ricketts", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "ne_sen_2024"        # 2024 Senate (Osborn v Fischer): same office and independent candidate (MEDSL county returns of the certified canvass, CC0; Osborn in the dem column)
votes = "ne_gov_2022"        # 2022 governor two-party votes (midterm turnout pattern; MEDSL, CC0)
poll_avg = 0.4895           # two-party Dem share, weighted average of 3 polls
poll_sd = 0.0417            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 3
poll_last = "2026-10-23"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.4008        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 replays without a vote-type split (this feed has none), as SC/FL
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.0245   # poll_avg - prior statewide share 0.4650 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0334      # historical RMSE of a poll average with 3 polls (brunder.us.POLL_SD_BINS)
count_scaled_terms = true   # tau / between-region terms scale in with the counted votes

[count]                    # brunder.us.CountRules
# Side a is Dan Osborn, independent ("By Petition", party code PET in the feed); there is no Democrat on the
# ballot. NE counties count early ballots on election night; the service gives precincts reporting per county and
# no vote-type split: f = counted / expected votes, capped at 0.95 until every precinct reported, then 98%
# counted; complete counties re-scale the rest (learned turnout).
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = false

[markets.polymarket]
event = "nebraska-senate-election-winner"
market = "will-an-independent-win-the-nebraska-senate-race-in-2026"
question = "Will an independent win the Nebraska Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
