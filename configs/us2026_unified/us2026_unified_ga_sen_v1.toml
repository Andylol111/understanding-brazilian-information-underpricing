# US midterms 2026-11-03, Georgia Senate: UNIFIED pre-count model (labelled challenger to v1/v3; not a replacement).
# One model for races with and without polls: fundamentals (last presidential and same-office lean, seat holder, national
# generic-ballot swing) blended with the poll average by number of polls, county shares and expected votes from past
# results, population growth and demographics (docs/us_unified.md). Parameters fitted leave-one-cycle-out on 2016-2024.
# Same [election], [count] and [markets] as us2026_ga_sen_v1.toml except turnout_ratio = 1.0 (the prior's V is already the expected
# vote). The prior is us2026_unified_priors.csv (NOT read by brunder.us.load_priors: run it with
# analysis/us_unified_replay.py). Statewide forecast 0.5546 ± 0.0280 (P(D wins) 0.974),
# 7 polls in the window, poll average 0.5506; frozen 2026-11-02.
# Frozen before polls close; nothing here was chosen on 2026 count data.
id = "us2026_unified_ga_sen_v1"

[election]
eid = "us2026"
race_id = "ga-sen"
name = "Georgia Senate"
state = "ga"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "ga"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Jon Ossoff", color = "#1f5fbf" }
b = { party = "REP", name = "Mike Collins", color = "#c8102e" }

[prior]                    # data_public/us2026_unified_priors.csv
share = "uni_ga_sen_2026"
votes = "uni_ga_sen_2026"
statewide_mean = 0.5546
statewide_sd = 0.0280
p_win = 0.9742
poll_n = 7

[model]                    # brunder.nowcast.Params: count-order settings as the registered v1 of this feed
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0       # the unified prior already contains the poll / national information
swing_prior_sd = 0.0280      # predictive sd of the statewide share (leave-one-cycle-out residuals by number of polls)
count_scaled_terms = true

[count]                    # brunder.us.CountRules
# GA posts advance + mail votes first and finishes Election Day precincts on the night: a county with
# every precinct reported is taken as 98% counted; those counties re-scale the rest (learned turnout).
# Settings checked on GA 2022/2024 certified vote-type results (analysis/us_calibrate.py).
# vote_type: counties split into early+mail and Election Day units (the feed reports early votes);
# early_share = 0.64 = GA 2022 governor/Senate advance+mail share (SoS certified).
turnout_ratio = 1.0         # unified V = expected two-party votes of the county
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.64

[markets.polymarket]
event = "georgia-senate-election-winner"
market = "will-the-democrats-win-the-georgia-senate-race-in-2026"
question = "Will the Democrats win the Georgia Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
