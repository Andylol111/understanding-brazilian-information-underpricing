# US midterms 2026-11-03, Arizona governor: UNIFIED pre-count model (labelled challenger to v1/v3; not a replacement).
# One model for races with and without polls: fundamentals (last presidential and same-office lean, seat holder, national
# generic-ballot swing) blended with the poll average by number of polls, county shares and expected votes from past
# results, population growth and demographics (docs/us_unified.md). Parameters fitted leave-one-cycle-out on 2016-2024.
# Same [election], [count] and [markets] as us2026_az_gov_v1.toml except turnout_ratio = 1.0 (the prior's V is already the expected
# vote). The prior is us2026_unified_priors.csv (NOT read by brunder.us.load_priors: run it with
# analysis/us_unified_replay.py). Statewide forecast 0.5378 ± 0.0303 (P(D wins) 0.894),
# 3 polls in the window, poll average 0.5304; frozen 2026-11-02.
# Frozen before polls close; nothing here was chosen on 2026 count data.
id = "us2026_unified_az_gov_v1"

[election]
eid = "us2026"
race_id = "az-gov"
name = "Arizona governor"
state = "az"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "az"                    # brunder.us.FEEDS (AZ SoS Enhanced Voting, resolver --ga-enr …/Arizona (already recorded))
poll_close_utc = "2026-11-04T02:00:00Z"
a = { party = "DEM", name = "Katie Hobbs", color = "#1f5fbf" }
b = { party = "REP", name = "Andy Biggs", color = "#c8102e" }

[prior]                    # data_public/us2026_unified_priors.csv
share = "uni_az_gov_2026"
votes = "uni_az_gov_2026"
statewide_mean = 0.5378
statewide_sd = 0.0303
p_win = 0.8940
poll_n = 3

[model]                    # brunder.nowcast.Params: count-order settings as the registered v1 of this feed
tau = 0.08
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.0       # the unified prior already contains the poll / national information
swing_prior_sd = 0.0303      # predictive sd of the statewide share (leave-one-cycle-out residuals by number of polls)
count_scaled_terms = true

[count]                    # brunder.us.CountRules
# AZ counts early ballots dropped off on Election Day ("late earlies") for days after the polls close, so precincts
# reporting says little about ballots left (as in CA): one unit per county, f = counted / expected (2022 governor
# two-party votes x 1.0), capped at 0.90, no complete flag, no learned turnout.
turnout_ratio = 1.0         # unified V = expected two-party votes of the county
f_max = 0.9
f_complete = 0.0
use_outstanding = false
learn_turnout = false
vote_type = false

[markets.polymarket]
event = "arizona-governor-winner-2026"
market = "will-the-democrat-win-the-arizona-governor-race-in-2026"
question = "Will the Democrats win the Arizona governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
