# US midterms 2026-11-03, Texas Senate: UNIFIED pre-count model (labelled challenger to v1/v3; not a replacement).
# One model for races with and without polls: fundamentals (last presidential and same-office lean, seat holder, national
# generic-ballot swing) blended with the poll average by number of polls, county shares and expected votes from past
# results, population growth and demographics (docs/us_unified.md). Parameters fitted leave-one-cycle-out on 2016-2024.
# Same [election], [count] and [markets] as us2026_tx_sen_v1.toml except turnout_ratio = 1.0 (the prior's V is already the expected
# vote). The prior is us2026_unified_priors.csv (NOT read by brunder.us.load_priors: run it with
# analysis/us_unified_replay.py). Statewide forecast 0.5075 ± 0.0226 (P(D wins) 0.631),
# 20 polls in the window, poll average 0.5144; frozen 2026-11-02.
# Frozen before polls close; nothing here was chosen on 2026 count data.
id = "us2026_unified_tx_sen_v1"

[election]
eid = "us2026"
race_id = "tx-sen"
name = "Texas Senate"
state = "tx"
race = "sen"                   # race key in the parsed feed (gov / sen)
feed = "tx"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T01:00:00Z"
a = { party = "DEM", name = "James Talarico", color = "#1f5fbf" }
b = { party = "REP", name = "Ken Paxton", color = "#c8102e" }

[prior]                    # data_public/us2026_unified_priors.csv
share = "uni_tx_sen_2026"
votes = "uni_tx_sen_2026"
statewide_mean = 0.5075
statewide_sd = 0.0226
p_win = 0.6310
poll_n = 20

[model]                    # brunder.nowcast.Params: count-order settings as the registered v1 of this feed
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0       # the unified prior already contains the poll / national information
swing_prior_sd = 0.0226      # predictive sd of the statewide share (leave-one-cycle-out residuals by number of polls)
count_scaled_terms = true

[count]                    # brunder.us.CountRules
# TX counts early in-person and mail ballots first and nearly everything on election night: once every
# polling place in a county reported, 98% of its vote is assumed in; those counties re-scale the
# expected vote of the rest (learned turnout).
# vote_type: counties split into early+mail and Election Day units (the feed reports early votes);
# early_share = 0.6 (assumption: no TX county vote-type history in the sources used).
turnout_ratio = 1.0         # unified V = expected two-party votes of the county
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.6

[markets.polymarket]
event = "texas-senate-election-winner"
market = "will-the-democrats-win-the-texas-senate-race-in-2026"
question = "Will the Democrats win the Texas Senate race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
