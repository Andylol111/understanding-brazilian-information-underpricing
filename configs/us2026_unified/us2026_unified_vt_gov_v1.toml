# US midterms 2026-11-03, Vermont governor: UNIFIED pre-count model (labelled challenger to v1/v3; not a replacement).
# One model for races with and without polls: fundamentals (last presidential and same-office lean, seat holder, national
# generic-ballot swing) blended with the poll average by number of polls, county shares and expected votes from past
# results, population growth and demographics (docs/us_unified.md). Parameters fitted leave-one-cycle-out on 2016-2024.
# Same [election], [count] and [markets] as us2026_vt_gov_v1.toml except turnout_ratio = 1.0 (the prior's V is already the expected
# vote). The prior is us2026_unified_priors.csv (NOT read by brunder.us.load_priors: run it with
# analysis/us_unified_replay.py). Statewide forecast 0.5071 ± 0.0480 (P(D wins) 0.559),
# 2 polls in the window, poll average 0.5084; frozen 2026-11-02.
# Frozen before polls close; nothing here was chosen on 2026 count data.
id = "us2026_unified_vt_gov_v1"

[election]
eid = "us2026"
race_id = "vt-gov"
name = "Vermont governor"
state = "vt"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "vt"                    # brunder.us.FEEDS (Vermont SoS static JSON; towns summed to the 14 counties)
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Amanda Janoo", color = "#1f5fbf" }
b = { party = "REP", name = "Phil Scott", color = "#c8102e" }

[prior]                    # data_public/us2026_unified_priors.csv
share = "uni_vt_gov_2026"
votes = "uni_vt_gov_2026"
statewide_mean = 0.5071
statewide_sd = 0.0480
p_win = 0.5590
poll_n = 2

[model]                    # brunder.nowcast.Params: count-order settings as the registered v1 of this feed
tau = 0.06
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.0       # the unified prior already contains the poll / national information
swing_prior_sd = 0.0480      # predictive sd of the statewide share (leave-one-cycle-out residuals by number of polls)
count_scaled_terms = true

[count]                    # brunder.us.CountRules
# Vermont towns count all ballots, absentee included, on election night: a county is complete when all its towns
# reported (98% of its vote assumed in); complete counties re-scale the rest. turnout_ratio 0.72 = mean 2022/2024
# two-party vote ratio in the CA, TX and GA official data of this project (0.69, 0.71, 0.75).
turnout_ratio = 1.0         # unified V = expected two-party votes of the county
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true

[markets.polymarket]
event = "vermont-governor-winner-2026"
market = "will-the-democrats-win-the-vermont-governor-race-in-2026"
question = "Will the Democrats win the Vermont governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
