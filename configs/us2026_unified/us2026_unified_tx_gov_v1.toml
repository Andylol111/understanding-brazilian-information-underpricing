# US midterms 2026-11-03, Texas governor: UNIFIED pre-count model (labelled challenger to v1/v3; not a replacement).
# One model for races with and without polls: fundamentals (last presidential and same-office lean, seat holder, national
# generic-ballot swing) blended with the poll average by number of polls, county shares and expected votes from past
# results, population growth and demographics (docs/us_unified.md). Parameters fitted leave-one-cycle-out on 2016-2024.
# Same [election], [count] and [markets] as us2026_tx_gov_v1.toml except turnout_ratio = 1.0 (the prior's V is already the expected
# vote). The prior is us2026_unified_priors.csv (NOT read by brunder.us.load_priors: run it with
# analysis/us_unified_replay.py). Statewide forecast 0.4814 ± 0.0226 (P(D wins) 0.205),
# 18 polls in the window, poll average 0.4860; frozen 2026-11-02.
# Frozen before polls close; nothing here was chosen on 2026 count data.
id = "us2026_unified_tx_gov_v1"

[election]
eid = "us2026"
race_id = "tx-gov"
name = "Texas governor"
state = "tx"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "tx"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T01:00:00Z"
a = { party = "DEM", name = "Gina Hinojosa", color = "#1f5fbf" }
b = { party = "REP", name = "Greg Abbott", color = "#c8102e" }

[prior]                    # data_public/us2026_unified_priors.csv
share = "uni_tx_gov_2026"
votes = "uni_tx_gov_2026"
statewide_mean = 0.4814
statewide_sd = 0.0226
p_win = 0.2046
poll_n = 18

[model]                    # brunder.nowcast.Params: count-order settings as the registered v1 of this feed
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0       # the unified prior already contains the poll / national information
swing_prior_sd = 0.0226      # predictive sd of the statewide share (leave-one-cycle-out residuals by number of polls)
count_scaled_terms = true

[count]                    # brunder.us.CountRules
# As tx-sen.
turnout_ratio = 1.0         # unified V = expected two-party votes of the county
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.6

[markets.polymarket]
event = "texas-governor-winner-2026"
market = "will-the-democrats-win-the-texas-governor-race-in-2026"
question = "Will the Democrats win the Texas governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
