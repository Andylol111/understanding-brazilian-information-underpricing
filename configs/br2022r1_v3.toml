# br2022r1 v3 SENSITIVITY: POLL START (RETROSPECTIVE, NOT PRE-REGISTERED: designed after the result was known, chosen after the
# result was known). v1 stays the headline. Everything is v1's (prior, tau, rho, kappa, count states) except a starting
# estimate of the national swing from the final polls (analysis/poll_priors.py; rule written before this night was replayed with it):
#   swing_prior_mean = poll two-way share of Lula / (Lula + Bolsonaro) 0.5692 (plain mean of 20 polls whose fieldwork ended
#       2022-09-18 .. 2022-10-01, the 14 days before the vote; Wikipedia poll tables, CC BY-SA, data_public/)
#       minus the prior's vote-weighted two-way share 0.3892 (2018 round 1 by municipality);
#   swing_prior_sd = root-mean-square error of the same kind of poll average over 4 earlier elections = 0.0600;
#   count_scaled_terms: tau enters in proportion to the weight the counted votes have in the swing, so before any count the
#       uncertainty is the poll error alone; no count, price or exit poll of this night is an input.
[election]
cycle = "ele2022"
race = "share"
cand_a = "13"
cand_b = "22"

[prior]
kind = "open"
year = 2018
round = 1
cand_a = "13"
cand_b = "17"

[model]
kind = "municipal"
tau = 0.015          # v1
kappa = 50000.0
rho = 0.8
swing_prior_mean = 0.18006    # poll 0.56923 - prior base 0.38917
swing_prior_sd = 0.05995      # RMS poll error, 4 earlier elections
count_scaled_terms = true

[poll]
file = "br_polls_2022r1.csv"
election_date = "2022-10-02"
n_polls = 20
two_way = 0.56923
prior_base = 0.38917
sd = 0.05995
n_errors = 4
pollsters = ["Abrapel/Ipespe", "Arko/Atlas", "Atlas", "BTG Pactual/FSB", "BTG/FSB", "CNT/MDA", "Datafolha", "Exame/Ideia", "Genial/Quaest", "IPEC", "Ipec", "PoderData", "XP/Ipespe"]

[replay]
year = 2022
round = 1
