# US midterms 2026-11-03, Arizona governor: model v5 (SECONDARY; the primary stays us2026_az_gov_v3).
# Identical to us2026_az_gov_v3.toml (sha256 116216c0e72d3d8d7fd84dd2981e4b6eeb8bdac39ff2aaec905a5d009f84a939) except the night Hispanic slope: a county's expected swing is
# the state swing + beta*(its Hispanic share - the state's expected-vote mean), with beta estimated from the
# night's own counted counties (vote-weighted least squares, Normal(0, hisp_slope_tau^2) prior shrinking it
# to 0 when few counties have reported) and its uncertainty added to the margin variance. The slope is never
# carried over from earlier cycles (it changes sign). Hispanic share: Census ACS 2020-24 B03003.
# Backtest and choice of hisp_slope_tau: docs/us_hisp_slope.md.
id = "us2026_az_gov_v5"
role = "secondary"

[election]
eid = "us2026"
race_id = "az-gov"
name = "Arizona governor"
state = "az"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "az"                    # brunder.us.FEEDS (AZ SoS Enhanced Voting, resolver --ga-enr …/Arizona (already recorded))
poll_close_utc = "2026-11-04T02:00:00Z"
a = { party = "DEM", name = "Katie Hobbs", color = "#1f5fbf" }
b = { party = "REP", name = "Andy Biggs", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv or data_public/us2026_priors.csv
share = "az_gov_2022"        # 2022 governor (Hobbs v Lake): same office and incumbent, last midterm (MEDSL precinct returns of the certified results, CC0)
votes = "az_gov_2022"        # 2022 governor two-party votes
poll_avg = 0.5304           # two-party Dem share, weighted average of 3 polls
poll_sd = 0.0404            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 3
poll_last = "2026-10-27"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.7745        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; as CA: GA no-split value 0.06 widened for a days-long count (judgment, not calibrated)
tau = 0.08
rho = 0.3
sigma_mun0 = 0.08
swing_prior_mean = 0.0271   # poll_avg - prior statewide share 0.5033 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0334      # historical RMSE of a poll average with 3 polls (brunder.us.POLL_SD_BINS)
count_scaled_terms = true   # tau / between-region terms scale in with the counted votes
hisp_slope = true               # night Hispanic slope (brunder.nowcast): swing = state swing + beta*(h - state h)
hisp_slope_tau = 0.2           # prior sd of beta, chosen on backtests before 2026 (docs/us_hisp_slope.md)

[count]                    # brunder.us.CountRules
# AZ counts early ballots dropped off on Election Day ("late earlies") for days after the polls close, so precincts
# reporting says little about ballots left (as in CA): one unit per county, f = counted / expected (2022 governor
# two-party votes x 1.0), capped at 0.90, no complete flag, no learned turnout.
turnout_ratio = 1.0
f_max = 0.9
f_complete = 0.0
use_outstanding = false
learn_turnout = false
vote_type = false
hisp_share = "data_public/us2026_hispanic_share.csv"   # county Hispanic share, ACS 2020-24 B03003

[markets.polymarket]
event = "arizona-governor-winner-2026"
market = "will-the-democrat-win-the-arizona-governor-race-in-2026"
question = "Will the Democrats win the Arizona governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
