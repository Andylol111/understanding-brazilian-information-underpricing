# US midterms 2026-11-03, Alaska governor. Frozen before polls close (first close 2026-11-03 23:00 UTC); the integrator
# registers it (prereg/registry.jsonl). Nothing here was chosen on 2026 count data. Settings and evidence:
# docs/us_midterms.md. Live/replay: uv run brunder us live|export configs/us2026_*_v1.toml
id = "us2026_ak_gov_v1"

[election]
eid = "us2026"
race_id = "ak-gov"
name = "Alaska governor"
state = "ak"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "ak"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T05:00:00Z"
a = { party = "DEM", name = "Jonathan Kreiss-Tomkins", color = "#1f5fbf" }
b = { party = "REP", name = "Bernadette Wilson", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "ak_gov_p2026"        # 2026 top-four primary, Democratic v Republican candidates' first-choice votes by house district
votes = "ak_gov_p2026"        # as ak-sen

[model]                    # brunder.nowcast.Params; GA no-split value 0.06 widened for a weeks-long count (judgment, not calibrated)
tau = 0.08
rho = 0.3
sigma_mun0 = 0.08

[count]                    # brunder.us.CountRules
# As ak-sen. a = all Democratic-labelled candidates, b = all Republican-labelled (RCV bloc proxy).
turnout_ratio = 1.4
f_max = 0.95
f_complete = 0.0
use_outstanding = false
learn_turnout = false

[markets.polymarket]
event = "alaska-governor-election-winner"
market = "will-jonathan-kreiss-tomkins-win-the-2026-alaska-governor-election"
question = "Will Jonathan Kreiss-Tomkins win the 2026 Alaska governor election?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
