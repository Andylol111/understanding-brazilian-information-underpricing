# br2026r2 v3 SENSITIVITY: POLL START (RETROSPECTIVE, NOT PRE-REGISTERED: designed after the result was known, chosen after the
# result was known). v1 stays the headline. Everything is v1's (prior, tau, rho, kappa, count states) except a starting
# estimate of the national swing from the final polls (analysis/poll_priors.py; rule written before this night was replayed with it):
#   swing_prior_mean = poll two-way share of Lula / (Lula + Flávio Bolsonaro) 0.4899 (plain mean of 48 polls whose fieldwork ended
#       2026-10-12 .. 2026-10-24, the 14 days before the vote; Wikipedia poll tables, CC BY-SA, data_public/)
#       minus the prior's vote-weighted two-way share 0.4898 (2026 round 1 by municipality);
#   swing_prior_sd = root-mean-square error of the same kind of poll average over 7 earlier elections = 0.0488;
#   count_scaled_terms: tau enters in proportion to the weight the counted votes have in the swing, so before any count the
#       uncertainty is the poll error alone; no count, price or exit poll of this night is an input.
[election]
cycle = "ele2026"
ele = 6258
cargo = 1
race = "share"           # Lula / (Lula + Flávio) > ½
cand_a = "13"
cand_b = "22"

[prior]                  # 2026 first round by municipality, same two candidates (two-party share)
kind = "live"
ele = 6257

[model]
kind = "municipal"
tau = 0.015          # v1
kappa = 50000.0
rho = 0.8
swing_prior_mean = 0.00011    # poll 0.48991 - prior base 0.48980
swing_prior_sd = 0.04880      # RMS poll error, 7 earlier elections
count_scaled_terms = true

[poll]
file = "br_polls_2026r2.csv"
election_date = "2026-10-25"
n_polls = 48
two_way = 0.48991
prior_base = 0.48980
sd = 0.04880
n_errors = 7
pollsters = ["Alfa", "AtlasIntel", "Colectta", "DataTrends", "Datafolha", "Datatrends", "Futura", "Gerp", "Ideia", "Indexa", "Instituto França", "Ipespe", "MDA", "Nexus", "Palver", "PoderData", "Quaest", "Real Time", "Verita", "Veritá", "Vox Brasil"]

[replay]
year = 2026
round = 2

[trade]
min_edge = 0.05
min_counted = 0.01
favoured_only = true
half_spread = 0.01
fee_rate = 0.0           # runoff markets: feeSchedule rate 0

[markets.national]
event = "brazil-presidential-election"
market = "will-luiz-incio-lula-da-silva-win-the-2026-brazilian-presidential-election"

