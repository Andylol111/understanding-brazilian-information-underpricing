# RETROSPECTIVE SENSITIVITY — chosen after this result was known; v1 remains the headline.
# Settings selected only from 2014, 2018 and 2022 count nights by the fixed rule in docs/brazil.md.
[election]
cycle = "ele2026"
ele = 6258
cargo = 1
race = "share"           # Lula / (Lula + Flávio) > ½
cand_a = "13"
cand_b = "22"

[prior]                  # 2026 first round by municipality, same two candidates (two-party share)
kind = "live"
ele = 6257

[model]
kind = "municipal"
tau = 0.005
kappa = 100000.0
rho = 0.5

[replay]
year = 2026
round = 2

[trade]
min_edge = 0.05
min_counted = 0.01
favoured_only = true
half_spread = 0.01
fee_rate = 0.0           # runoff markets: feeSchedule rate 0

