# SENSITIVITY version, chosen AFTER the 2026 result was known (2026-10-30); v1 (configs/hu2026_v1.toml, 2022 night
# only) stays the headline. Only the uncertainty settings change: district tau/sigma_mun0/kappa and list tau were
# re-chosen by the common multi-night rule written in docs/hungary.md ("v2") BEFORE analysis/hu_calibrate_v2.py was
# run: nights 2022 (real archived order; 2018 prior) and 2018 (simulated orders of the official station results;
# 2014 prior) for the district model, plus 2014 (simulated; 2010 county prior) for the list model. Results are in
# results/hungary/calibration_v2.json. Every other setting is v1's (2022-only: postal, envelope, turnout).
# Evidence label: sensitivity (settings chosen after the result was known); not pre-registered.
id = "hu2026_v2"
election = "Hungary, National Assembly, 2026-04-12; polls closed 17:00 UTC (19:00 CEST)"
poll_close_utc = "2026-04-12T17:00:00Z"
year = 2026
prior_year = 2022
seed = 20260412

[model.district]             # brunder.nowcast.Params for the 106 districts in 20 county groups
tau = 0.015                  # smallest tau meeting the multi-night rule (docs/hungary.md v2): pooled coverage >= 0.90, worst night >= 0.75
sigma_mun0 = 0.03            # lowest mean district MAE (2022: 1.29 pt, 2018 simulated: 2.45 pt) among passing settings at that tau
kappa = 200000.0             # same
rho = 0.8                    # nowcast default, not tuned
nu_mun = 20.0
sigma_uf0 = 0.03
nu_uf = 5.0

[model.list]                 # brunder.nowcast.Params for the national list vote over the 20 counties
tau = 0.03                   # smallest tau meeting the multi-night rule on the national list share (2022 / 2018 / 2014 coverage 0.80 / 0.92 / 0.98)

[model.other]
mail_kappa = 20000.0         # default, not tuned
mail_tau = 0.02              # default, not tuned
mail_return = 0.5892         # 2022 final valid postal ballots / registered postal voters (268,766 / 456,129)
mail_two_way = 0.9801        # 2022 A+B share of valid postal list votes
envelope_rate = 0.9280       # 2022 envelope votes / registered transferred + consular voters (206,980 / 223,031)
env_shift = 0.1899           # 2022: A two-way share of domestic votes counted after the night minus the night share
env_sd = 0.10                # judgment (one past election), not fitted
turnout_sd = 0.0179          # RMS error of the projected turnout over the 2022 night frames
other_tau = 0.10             # default, not tuned
draws = 4000

[prior]                      # 2022 official final, mapped onto the 2026 districts (brunder.hungary.crosswalk)
source = "https://vtr.valasztas.hu/ogy2022/data/04161400/szavossz/OevkJkv.json"
file = "hungary/ogy2022/04161400/szavossz/OevkJkv.json"
sha256 = "88a1dfc8b61df5782580268a72e2035527f83b6a715cd93e8f69acce9b3d3b06"
list_file = "hungary/ogy2022/04161400/szavossz/ListasJkv.json"
list_sha256 = "cca16395d828829d948e924e6172419a80796413f614ffc7962fa8c77ab77da7"

[groups]                     # nominating-group (jlcs) codes of the official site; A = Tisza, B = Fidesz-KDNP
a = 3600                     # TISZA (list tl_id 1934)
b = 3644                     # FIDESZ-KDNP (joint list, tl_id 1930)
tl_a = 1934
tl_b = 1930
prior_a = [1803]             # 2022: DK-JOBBIK-MOMENTUM-MSZP-LMP-PÁRBESZÉD (joint opposition)
prior_b = [1798]             # 2022: FIDESZ-KDNP
min_list_share = 0.01        # third-party lists below this share of the counted list vote are not simulated

[prices]                     # Polymarket 1-minute history window archived by analysis/hu_fetch.py markets
start_utc = "2026-04-12T15:00:00Z"
end_utc = "2026-04-19T00:00:00Z"

[trade]                      # the frozen Brazil night rule (configs/night_r2_v1.toml), unchanged
min_edge = 0.05
min_counted = 0.01
favoured_only = true
half_spread = 0.01

