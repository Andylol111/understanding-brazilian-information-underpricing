# US midterms 2026-11-03, Georgia governor: model v2. Identical to us2026_ga_gov_v1.toml (sha256 9da7ce65c1207b290b35523cedef614ca92178c8d9509100ad00c3ee4577a2c4)
# except a prior on the statewide swing from the polls ([model] swing_prior_*; brunder.nowcast): the
# swing is the precision-weighted mix of the poll prior and the swing in counted votes, so the polls
# lead early and the count takes over. Poll average frozen here (rule docs/us_midterms.md#polls;
# VoteHub polls, CC BY 4.0, data built 2026-10-29T00:09:07Z); nothing is fetched on the night. v1 and v2 are both
# registered and scored.
id = "us2026_ga_gov_v2"

[election]
eid = "us2026"
race_id = "ga-gov"
name = "Georgia governor"
state = "ga"
race = "gov"                   # race key in the parsed feed (gov / sen)
feed = "ga"                    # brunder.us.FEEDS
poll_close_utc = "2026-11-04T00:00:00Z"
a = { party = "DEM", name = "Keisha Lance Bottoms", color = "#1f5fbf" }
b = { party = "REP", name = "Rick Jackson", color = "#c8102e" }

[prior]                    # data/processed/us2026/priors.csv (brunder us priors)
share = "ga_gov_2022"        # 2022 governor (Abrams v Kemp): same office, last midterm
votes = "ga_gov_2022"        # 2022 governor two-party votes
poll_avg = 0.4934           # two-party Dem share, weighted average of 8 polls
poll_sd = 0.0397            # sqrt(POLL_SD_HIST^2 + sampling variance)
poll_n = 8
poll_last = "2026-10-23"      # latest field end date
poll_asof = "2026-11-02"      # window and weights counted back from this day
poll_p_win = 0.4337        # display only: Phi((avg - 0.5) / sd)

[model]                    # brunder.nowcast.Params; GA 2022/2024 vote-type replays, vote_type on (analysis/us_calibrate.py)
tau = 0.04
rho = 0.6
sigma_mun0 = 0.08
swing_prior_mean = 0.0313   # poll_avg - prior statewide share 0.4621 (V-weighted, data_public/us2026_priors.csv)
swing_prior_sd = 0.0397      # = poll_sd

[count]                    # brunder.us.CountRules
# As ga-sen.
turnout_ratio = 1.0
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.64

[markets.polymarket]
event = "georgia-governor-winner-2026"
market = "will-the-democrats-win-the-georgia-governor-race-in-2026"
question = "Will the Democrats win the Georgia governor race in 2026?"
yes_is = "a"

[markets.kalshi]           # filled by the Kalshi workstream in configs/pairs/us2026.toml
ticker = ""
