# US midterms 2026-11-03, PA-08 U.S. House: model v1. No swing: the count alone moves the 2024 president baseline.
# Counted units = the district's counties (a split county: only its part in the district, as the feed reports it).
# Prior = 2024 president in each county's part of the 2026 district (data_public/us2026_house_priors.csv,
# analysis/us_house_night.py priors; same allocation as site/data/us2026/house/districts.json). Settings from the
# 2024 replay of the same feed's House contests (analysis/us_house_night.py replay; data_public/us2026_house_calibration.json):
# Pennsylvania's feed is not in the replay (added 2026-10-30); settings of the replayed group of feeds with an early-vote split (TX, NC, GA, AZ), 34 replayed districts; 90 % coverage 0.98/0.98/0.95 at 5/25/50 % counted, mean |error| 0.018/0.012/0.010.
# Frozen before polls close; the integrator registers it (prereg/registry.jsonl). Nothing here was chosen on 2026 count
# data. Market selection: P(D) Polymarket 0.870, Kalshi 0.865 in markets.json built 2026-10-29 (rule: Polymarket or Kalshi in [0.05, 0.95]).
id = "us2026_house_pa-08_v1"

[election]
eid = "us2026"
race_id = "house:PA-08"
name = "PA-08 U.S. House"
state = "pa"
race = "house-08"             # race key in the parsed feed (brunder.us_house_night)
feed = "pa_house"             # brunder.us.FEEDS: the state's recorded feed, House contests
poll_close_utc = "2026-11-04T01:00:00Z"
a = { party = "DEM", name = "Paige Cognetti", color = "#1f5fbf" }
b = { party = "REP", name = "Rob Bresnahan", color = "#c8102e" }

[prior]
share = "pa-08_pres_2024"     # 2024 president (Harris v Trump), county parts of the 2026 district
votes = "pa-08_pres_2024"     # its two-party votes × turnout_ratio = expected 2026 two-party votes

[model]                    # brunder.nowcast.Params
tau = 0.01
rho = 0.6
sigma_mun0 = 0.08
sigma_uf0 = 0.03                # prior sd of a region's swing (one district = one region; early/late with vote_type)

[count]                    # brunder.us.CountRules
turnout_ratio = 0.72         # 2026 midterm / 2024 president two-party votes (brunder.us.EST_TURNOUT)
f_max = 0.95
f_complete = 0.98
use_outstanding = false
learn_turnout = true
vote_type = true
early_share = 0.23

[markets.polymarket]
event = "pa-08-house-election-winner"
market = "will-the-democratic-party-win-the-pa-08-house-seat"
question = "Will the Democratic Party win the PA-08 House seat?"
yes_is = "a"

[markets.kalshi]           # timeline line needs a pair in configs/pairs/us2026.toml (race_id "house:PA-08")
ticker = ""                # Kalshi event HOUSEPA8-26, YES = HOUSEPA8-26-D
