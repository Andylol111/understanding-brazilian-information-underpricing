# Drop-in: also serve the added-source models' folder site/data/extra/us2026/ (brunder-us-extra-live). Same command
# as deploy/brunder-site.service plus "--election extra". Install: /etc/systemd/system/brunder-site.service.d/extra.conf
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -m brunder.liveserve --root /srv/brunder/repo/site/data --election us2026 --election nz2026 --election civic --election extra \
  --host 127.0.0.1 --port 8790
