name: tests

on:
  push:
    branches: [main]
    # data-only commits (the live log's 10-minute pushes) change no code: nothing to test
    paths-ignore:
      - "site/data/livelog/**"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q   # self-contained: no data/ needed
